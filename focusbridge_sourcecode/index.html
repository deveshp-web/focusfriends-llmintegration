const HOME={
  async getProfile(){return sGet("home-profile");},
  async hasProfile(){return !!(await sGet("home-profile"));},
  async createProfile(p){return sSet("home-profile",p);},
  async updateProfile(fields){const p=await sGet("home-profile")||{};return sSet("home-profile",{...p,...fields});},
  // ---- interface used by StudentApp (db.*) ----
  async getClassroom(){const p=await sGet("home-profile");if(!p)return null;return{name:"Home",tokenReward:p.tokenReward||"Special time!",tokenGoal:p.tokenGoal||5,nameMode:"full"};},
  async getSchedule(){return sGet("home-sched");},
  async joinStudent(code,id,name,avatar,schedule){
    let d=await sGet("home-student");
    if(!d){d={name:name||"Me",avatar:avatar||"🦊",stars:0,coins:0,tokens:0,badges:[],emotionLog:[],taskLog:[],aacCount:0,emoCount:0,sentenceCount:0,storiesRead:0,calmDone:[],schedule:(schedule||[]),streak:0,lastActive:"",lastSeen:new Date().toISOString()};await sSet("home-student",d);}
    return{id:"home-child",token:"home",data:d};},
  async getStudent(){return sGet("home-student");},
  async saveStudent(code,id,token,data){return sSet("home-student",data);},
  async getStories(){return (await sGet("home-stories"))||[];},
  // ---- grown-ups area helpers ----
  async saveSchedule(tasks){return sSet("home-sched",tasks);},
  async addStory(story){const ex=await sGet("home-stories")||[];return sSet("home-stories",[...ex,story]);},
  async deleteStory(sid){const ex=await sGet("home-stories")||[];return sSet("home-stories",ex.filter(s=>s.id!==sid));},
  async getRegion(){return sGet("home-region");},
  async setRegion(v){return sSet("home-region",v);},
  async deleteEverything(){await sDel("home-profile");await sDel("home-student");await sDel("home-sched");await sDel("home-stories");await sDel("home-region");return true;},
};

// number-to-words for 0-99 (used by the parental gate so the problem must be READ)
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
const numWord=n=>{n=Math.floor(n);if(n<20)return ONES[n];const t=Math.floor(n/10),o=n%10;return o?TENS[t]+"-"+ONES[o]:TENS[t];};

// A parental gate. Adult-easy, child-hard: the numbers are written as WORDS
// (so it requires reading), the math is two-digit addition (beyond most young
// children), each wrong answer reshuffles, and repeated misses trigger a short
// cooldown so the small set of answers cannot be guessed by trial and error.
// This is the standard app-store pattern for kids apps — a speed bump, not
// strong security.
function ParentalGate({onPass,onCancel}){
  const gen=()=>({a:21+Math.floor(Math.random()*59),b:21+Math.floor(Math.random()*59)});
  const [q,setQ]=useState(gen);
  const [val,setVal]=useState("");const [err,setErr]=useState("");
  const [attempts,setAttempts]=useState(0);const [cool,setCool]=useState(0);
  useEffect(()=>{if(cool<=0)return;const t=setTimeout(()=>setCool(c=>c-1),1000);return()=>clearTimeout(t);},[cool]);
  const check=()=>{
    if(cool>0)return;
    if(parseInt(val,10)===q.a+q.b){onPass();return;}
    const n=attempts+1;setAttempts(n);setVal("");setQ(gen());
    if(n%3===0){setCool(15);setErr("Too many tries. Please wait a moment.");}
    else setErr("That is not right. A grown-up can try again.");
  };
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:600,display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"Nunito,sans-serif"}}>
    <div style={{background:"white",borderRadius:24,padding:30,width:"100%",maxWidth:400,boxShadow:"0 20px 60px rgba(0,0,0,.4)",animation:"popIn .3s ease-out",textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:8}}>🔒</div>
      <div style={{fontWeight:900,fontSize:18,marginBottom:6,color:"#1A3A2A"}}>Grown-ups only</div>
      <div style={{fontSize:13,fontWeight:700,color:"#888",marginBottom:18,lineHeight:1.5}}>To keep this area for grown-ups, please read the words below and type the total as numbers.</div>
      <div style={{background:"#F0FFF4",border:"2px solid #A8E6CF",borderRadius:14,padding:"16px 14px",marginBottom:14}}>
        <div style={{fontSize:22,fontWeight:900,color:"#1A6B3C",lineHeight:1.4,textTransform:"capitalize"}}>{numWord(q.a)} plus {numWord(q.b)}</div>
        <div style={{fontSize:12,fontWeight:700,color:"#7Fb89A",marginTop:4}}>Type the answer using number keys</div>
      </div>
      <input value={val} onChange={e=>{setVal(e.target.value.replace(/\D/g,"").slice(0,3));setErr("");}} inputMode="numeric" autoFocus onKeyDown={e=>e.key==="Enter"&&check()} disabled={cool>0} placeholder="?" style={{width:130,padding:"12px",border:"2px solid "+(err?"#FFC0C0":"#e8e8e8"),borderRadius:12,fontFamily:"inherit",fontWeight:900,fontSize:24,textAlign:"center",background:cool>0?"#f5f5f5":"white"}}/>
      {err&&<div style={{fontSize:12,fontWeight:700,color:"#CC3333",marginTop:8}}>{err}</div>}
      <div style={{display:"flex",gap:9,marginTop:18}}>
        <button onClick={onCancel} style={{flex:1,background:"#f0f0f0",border:"none",borderRadius:14,padding:"12px",cursor:"pointer",fontWeight:800,color:"#888",fontFamily:"inherit"}}>Back</button>
        <button onClick={check} disabled={cool>0} style={{flex:2,background:cool>0?"#ccc":"#27AE60",border:"none",borderRadius:14,padding:"12px",cursor:cool>0?"not-allowed":"pointer",fontWeight:900,color:"white",fontFamily:"inherit"}}>{cool>0?("Wait "+cool+"s"):"Enter"}</button>
      </div>
    </div>
  </div>);
}

// Kid quick-start: tap a buddy, jump straight into play-at-home mode. No name,
// no typing, no reading beyond one line. Collects nothing — the profile is a
// picked avatar stored on this device only. Grown-up settings stay gated.
function KidStart({onBack,onPick}){
  const [busy,setBusy]=useState(false);
  const pick=async av=>{if(busy)return;setBusy(true);SFX.tap();await onPick(av);};
  return(<div style={{minHeight:"100vh",background:"linear-gradient(150deg,#FF8C69 0%,#FFB347 40%,#FF6B9D 100%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"Nunito,sans-serif",textAlign:"center"}}><style>{CSS}</style>
    <div style={{fontSize:"clamp(28px,5.5vw,44px)",fontWeight:900,color:"white",marginBottom:6,animation:"fadeUp .5s ease-out"}}>Pick your buddy!</div>
    <div style={{fontSize:15,fontWeight:800,color:"rgba(255,255,255,.85)",marginBottom:26}}>Tap one to start</div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(88px,1fr))",gap:12,maxWidth:540,width:"100%",animation:"slideIn .35s ease-out"}}>
      {AVS.map(av=><button key={av} onClick={()=>pick(av)} disabled={busy} className="lift" style={{fontSize:48,padding:"18px 0",border:"none",borderRadius:22,background:"rgba(255,255,255,.94)",cursor:busy?"wait":"pointer",boxShadow:"0 6px 22px rgba(0,0,0,.16)"}}>{av}</button>)}
    </div>
    <button onClick={onBack} style={{marginTop:30,background:"rgba(255,255,255,.18)",border:"2px solid rgba(255,255,255,.5)",borderRadius:18,padding:"9px 24px",cursor:"pointer",fontWeight:800,fontSize:13,color:"white",fontFamily:"inherit"}}>Back</button>
  </div>);
}

// Home onboarding: privacy note -> parental gate -> create a local profile.
function HomeSetup({onBack,onReady}){
  const [stage,setStage]=useState("intro"); // intro -> gate -> profile
  const [name,setName]=useState("");const [avatar,setAvatar]=useState("🦊");const [reward,setReward]=useState("Extra play time!");
  const [saving,setSaving]=useState(false);
  const finish=async()=>{
    setSaving(true);
    const fn=firstName(name);
    await HOME.createProfile({childName:fn,avatar,tokenReward:reward.trim()||"Special time!",tokenGoal:5});
    await HOME.joinStudent("HOME","home-child",fn||"Me",avatar,SD.map(t=>({id:t.id,done:false})));
    onReady(fn,avatar,reward.trim()||"Special time!");
  };
  return(<div style={{minHeight:"100vh",background:"linear-gradient(155deg,#F0FFF4,#E8F8F5 55%,#F0F9FF)",display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"Nunito,sans-serif"}}><style>{CSS}</style>
    {stage==="gate"&&<ParentalGate onPass={()=>setStage("profile")} onCancel={()=>setStage("intro")}/>}
    <div style={{background:"white",borderRadius:28,padding:36,width:"100%",maxWidth:460,boxShadow:"0 8px 40px rgba(0,0,0,.1)"}}>
      <button onClick={onBack} style={{background:"#f5f5f5",border:"none",borderRadius:12,padding:"8px 16px",cursor:"pointer",fontWeight:800,fontSize:13,fontFamily:"inherit",color:"#888",marginBottom:24}}>Back</button>

      {stage==="intro"&&<>
        <div style={{textAlign:"center",marginBottom:18}}><div style={{fontSize:48,marginBottom:8}}>🏠</div><div style={{fontSize:24,fontWeight:900,color:"#27AE60"}}>Focus Bridge at Home</div></div>
        <div style={{background:"#F8FFF8",border:"2px solid #A8E6CF",borderRadius:14,padding:16,marginBottom:16,fontSize:13,fontWeight:700,color:"#333",lineHeight:1.7}}>
          <div style={{marginBottom:8}}>Home mode is made for families — no school and no account needed.</div>
          <div style={{display:"flex",gap:8,marginBottom:6}}><span>✅</span><span>No sign-up, no email, no class code.</span></div>
          <div style={{display:"flex",gap:8,marginBottom:6}}><span>✅</span><span>We do not ask for your child's name or any personal details (you can add a first name just for this device if you like, and skip it entirely).</span></div>
          <div style={{display:"flex",gap:8}}><span>✅</span><span>Everything stays in the app on this device. Nothing is sent to us.</span></div>
        </div>
        <Btn onClick={()=>setStage("gate")} col="#27AE60" full>Get Started</Btn>
      </>}

      {stage==="profile"&&<>
        <div style={{textAlign:"center",marginBottom:18}}><div style={{fontSize:44,marginBottom:8}}>{avatar}</div><div style={{fontSize:22,fontWeight:900,color:"#27AE60"}}>Set up your child</div></div>
        <TxtInput label="Child's first name (optional — stays on this device, you can skip it)" value={name} onChange={e=>setName(e.target.value.slice(0,30))} placeholder="e.g. Alex (or leave blank)" green/>
        <div style={{marginBottom:16}}>
          <div style={{fontWeight:800,fontSize:13,color:"#333",marginBottom:10}}>Pick an Avatar</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:7}}>{AVS.map(av=><button key={av} onClick={()=>setAvatar(av)} style={{fontSize:28,padding:"8px 0",border:"none",cursor:"pointer",background:avatar===av?"#27AE6020":"transparent",borderRadius:12,outline:avatar===av?"3px solid #27AE60":"3px solid transparent"}}>{av}</button>)}</div>
        </div>
        <TxtInput label="Reward for finishing the token board (optional)" value={reward} onChange={e=>setReward(e.target.value)} placeholder="e.g. Extra play time!" green/>
        <Btn onClick={finish} disabled={saving} col="#27AE60" full>{saving?"Setting up...":"Start!"}</Btn>
      </>}
    </div></div>);
}

// Grown-ups area for home mode (behind a parental gate): progress, schedule,
// reward, data export and delete. All local.
function HomeParent({cls,onBack,onChanged,onDeleteAll}){
  const [gate,setGate]=useState(true);
  const [child,setChild]=useState(null);
  const [ed,setEd]=useState([]);const [pickFor,setPickFor]=useState(null);const [schedMsg,setSchedMsg]=useState("");
  const [reward,setReward]=useState(cls?.tokenReward||"");const [goal,setGoal]=useState(cls?.tokenGoal||5);const [setMsg,setSetMsg]=useState("");
  const [delArm,setDelArm]=useState(false);
  const [zip3,setZip3]=useState("");const [regionSent,setRegionSent]=useState(null);

  useEffect(()=>{(async()=>{
    setChild(await HOME.getStudent());
    setRegionSent(await HOME.getRegion());
    const cs=await HOME.getSchedule();const base=(cs&&cs.length)?cs:SD;
    setEd(base.map(t=>({id:t.id,emoji:t.emoji,label:t.label,time:t.time,mins:t.mins||5})));
  })();},[]);

  const move=(i,dir)=>{setEd(p=>{const a=[...p];const j=i+dir;if(j<0||j>=a.length)return p;const tmp=a[i];a[i]=a[j];a[j]=tmp;return a;});};
  const updEd=(i,f,v)=>setEd(p=>p.map((t,k)=>k===i?{...t,[f]:v}:t));
  const addRow=()=>setEd(p=>[...p,{id:p.reduce((m,t)=>Math.max(m,t.id),0)+1,emoji:"⭐",label:"New Task",time:"9:00 AM",mins:5}]);
  const rmRow=i=>setEd(p=>p.filter((_,k)=>k!==i));
  const saveSched=async()=>{const clean=ed.map((t,i)=>({id:t.id,emoji:t.emoji,label:t.label.trim()||("Task "+(i+1)),time:t.time.trim()||"9:00 AM",mins:Math.max(1,parseInt(t.mins)||5)}));await HOME.saveSchedule(clean);setSchedMsg("ok");setTimeout(()=>setSchedMsg(""),3500);};
  const saveReward=async()=>{const g=Math.min(10,Math.max(1,parseInt(goal)||5));await HOME.updateProfile({tokenReward:reward.trim()||"Special time!",tokenGoal:g});setSetMsg("ok");onChanged&&onChanged();setTimeout(()=>setSetMsg(""),3000);};
  const exportAll=async()=>{const prof=await HOME.getProfile();const st=await HOME.getStudent();download("focus-bridge-home-data.json",JSON.stringify({profile:prof,progress:st,exportedAt:new Date().toISOString()},null,2));};
  const shareRegion=async()=>{if(zip3.length!==3)return;ping("region-"+zip3);await HOME.setRegion(zip3);setRegionSent(zip3);};
  const doDelete=async()=>{if(!delArm){setDelArm(true);setTimeout(()=>setDelArm(false),3000);return;}await HOME.deleteEverything();await DB.clearSession();onDeleteAll();};

  if(gate)return <div style={{minHeight:"100vh",background:"#F0F9F4",fontFamily:"Nunito,sans-serif"}}><style>{CSS}</style><ParentalGate onPass={()=>setGate(false)} onCancel={onBack}/></div>;

  const tasks=(child?.schedule||[]).filter(t=>t.done).length;
  return(<div style={{minHeight:"100vh",background:"#F0F9F4",fontFamily:"Nunito,sans-serif",padding:"20px 16px 40px"}}><style>{CSS}</style>
    <div style={{maxWidth:680,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18}}>
        <div style={{flex:1}}><h1 style={{fontSize:22,fontWeight:900,color:"#1A3A2A"}}>Grown-ups Area</h1><div style={{fontSize:13,color:"#888",fontWeight:700}}>Home mode · everything stays on this device</div></div>
        <button onClick={onBack} style={{background:"#27AE60",border:"none",borderRadius:12,padding:"10px 18px",cursor:"pointer",color:"white",fontWeight:900,fontSize:13,fontFamily:"inherit"}}>Back to App</button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:12,marginBottom:18}}>
        {[{e:"⭐",v:child?.stars||0,l:"Stars",c:"#F1C40F"},{e:"🔥",v:child?.streak||0,l:"Day Streak",c:"#E64A19"},{e:"✅",v:tasks,l:"Tasks Done",c:"#27AE60"},{e:"🏅",v:(child?.badges||[]).length,l:"Badges",c:"#E91E8C"}].map(s=><div key={s.l} style={{background:"white",borderRadius:16,padding:"14px",boxShadow:"0 2px 12px rgba(0,0,0,.06)",textAlign:"center"}}><div style={{fontSize:22}}>{s.e}</div><div style={{fontSize:22,fontWeight:900,color:s.c}}>{s.v}</div><div style={{fontSize:11,color:"#aaa",fontWeight:700}}>{s.l}</div></div>)}
      </div>

      <div style={{background:"white",borderRadius:18,padding:20,boxShadow:"0 2px 12px rgba(0,0,0,.06)",marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,flexWrap:"wrap",gap:8}}><div style={{fontWeight:900,fontSize:15}}>Activities your child can choose from</div><button onClick={saveSched} style={{background:"#27AE60",border:"none",borderRadius:11,padding:"8px 16px",cursor:"pointer",color:"white",fontWeight:900,fontSize:12,fontFamily:"inherit"}}>Save Schedule</button></div>
        <Ok msg={schedMsg==="ok"?"Saved! It will show next time the app opens.":""}/>
        {ed.map((t,i)=><div key={t.id} style={{borderBottom:i<ed.length-1?"1px solid #f5f5f5":"none",padding:"10px 0"}}>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <button onClick={()=>setPickFor(pickFor===t.id?null:t.id)} style={{fontSize:24,width:46,height:46,border:"2px solid #e8e8e8",borderRadius:12,background:"#fafafa",cursor:"pointer",flexShrink:0}}>{t.emoji}</button>
            <input value={t.label} onChange={e=>updEd(i,"label",e.target.value)} style={{flex:2,minWidth:120,padding:"9px 11px",border:"2px solid #e8e8e8",borderRadius:10,fontFamily:"inherit",fontWeight:800,fontSize:13}} onFocus={e=>e.target.style.borderColor="#27AE60"} onBlur={e=>e.target.style.borderColor="#e8e8e8"}/>
            
            <div style={{display:"flex",gap:4}}><button onClick={()=>move(i,-1)} disabled={i===0} style={{width:30,height:30,border:"none",borderRadius:8,background:"#f0f0f0",cursor:i===0?"not-allowed":"pointer",fontWeight:900,color:i===0?"#ddd":"#666"}}>↑</button><button onClick={()=>move(i,1)} disabled={i===ed.length-1} style={{width:30,height:30,border:"none",borderRadius:8,background:"#f0f0f0",cursor:i===ed.length-1?"not-allowed":"pointer",fontWeight:900,color:i===ed.length-1?"#ddd":"#666"}}>↓</button><button onClick={()=>rmRow(i)} disabled={ed.length<=1} style={{width:30,height:30,border:"none",borderRadius:8,background:"#FFF5F5",cursor:ed.length<=1?"not-allowed":"pointer",fontWeight:900,color:ed.length<=1?"#eee":"#CC3333"}}>✕</button></div>
          </div>
          {pickFor===t.id&&<div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:8,background:"#fafafa",borderRadius:10,padding:8}}>{TASK_EMOJIS.map(em=><button key={em} onClick={()=>{updEd(i,"emoji",em);setPickFor(null);}} style={{fontSize:20,padding:"4px 6px",border:"none",cursor:"pointer",borderRadius:7,background:t.emoji===em?"#27AE6020":"transparent",outline:t.emoji===em?"2px solid #27AE60":"2px solid transparent"}}>{em}</button>)}</div>}
        </div>)}
        <button onClick={addRow} style={{marginTop:12,width:"100%",background:"#f0f0f0",border:"2px dashed #ccc",borderRadius:12,padding:"11px",cursor:"pointer",fontWeight:800,color:"#666",fontFamily:"inherit",fontSize:13}}>+ Add Task</button>
      </div>

      <div style={{background:"white",borderRadius:18,padding:20,boxShadow:"0 2px 12px rgba(0,0,0,.06)",marginBottom:16}}>
        <div style={{fontWeight:900,fontSize:15,marginBottom:12}}>Reward</div>
        <TxtInput label="Reward for finishing the token board" value={reward} onChange={e=>setReward(e.target.value)} placeholder="e.g. Extra play time!" green/>
        <div style={{marginBottom:14}}><label style={{fontWeight:800,fontSize:13,color:"#333",display:"block",marginBottom:7}}>Tokens needed (1-10)</label><input value={goal} onChange={e=>setGoal(e.target.value.replace(/\D/g,"").slice(0,2))} inputMode="numeric" style={{width:90,padding:"10px",border:"2px solid #e8e8e8",borderRadius:11,fontFamily:"inherit",fontWeight:900,fontSize:18,textAlign:"center"}} onFocus={e=>e.target.style.borderColor="#27AE60"} onBlur={e=>e.target.style.borderColor="#e8e8e8"}/></div>
        <Ok msg={setMsg==="ok"?"Saved!":""}/>
        <Btn onClick={saveReward} col="#27AE60" small>Save Reward</Btn>
      </div>

      <div style={{background:"white",borderRadius:18,padding:20,boxShadow:"0 2px 12px rgba(0,0,0,.06)",marginBottom:16}}>
        <div style={{fontWeight:900,fontSize:15,marginBottom:6}}>Help us show where Focus Bridge is used <span style={{fontSize:12,fontWeight:800,color:"#aaa"}}>(optional)</span></div>
        <div style={{fontSize:12,color:"#888",fontWeight:700,marginBottom:12,lineHeight:1.6}}>If you'd like, share the first 3 digits of your ZIP code. This tells us the general region only — never your street, town, or anything about your child. It is sent as an anonymous count with no name or ID attached, and you can skip this entirely.</div>
        {regionSent?<div style={{background:"#F0FFF4",border:"2px solid #A8E6CF",borderRadius:12,padding:"10px 14px",fontSize:13,fontWeight:800,color:"#27AE60"}}>Thank you — region shared ({regionSent}xx)</div>:
        <div style={{display:"flex",gap:9,flexWrap:"wrap",alignItems:"center"}}>
          <input value={zip3} onChange={e=>setZip3(e.target.value.replace(/\D/g,"").slice(0,3))} inputMode="numeric" placeholder="935" style={{width:110,padding:"11px",border:"2px solid #e8e8e8",borderRadius:12,fontFamily:"inherit",fontWeight:900,fontSize:20,textAlign:"center",letterSpacing:"3px"}} onFocus={e=>e.target.style.borderColor="#27AE60"} onBlur={e=>e.target.style.borderColor="#e8e8e8"}/>
          <button onClick={shareRegion} disabled={zip3.length!==3} style={{background:zip3.length===3?"#27AE60":"#ddd",border:"none",borderRadius:12,padding:"11px 20px",cursor:zip3.length===3?"pointer":"not-allowed",fontWeight:900,fontSize:13,color:"white",fontFamily:"inherit"}}>Share region</button>
          <span style={{fontSize:12,fontWeight:700,color:"#bbb"}}>First 3 digits only</span>
        </div>}
      </div>

      <div style={{background:"white",borderRadius:18,padding:20,boxShadow:"0 2px 12px rgba(0,0,0,.06)"}}>
        <div style={{fontWeight:900,fontSize:15,marginBottom:6}}>Your Data</div>
        <div style={{fontSize:12,color:"#888",fontWeight:700,marginBottom:14,lineHeight:1.6}}>This data lives only in this app on this device. You can save a copy or erase it completely at any time.</div>
        <div style={{display:"flex",gap:9,flexWrap:"wrap"}}>
          <button onClick={exportAll} style={{flex:1,minWidth:140,background:"#EAF6FF",border:"2px solid #BdE0FF",borderRadius:12,padding:"11px",cursor:"pointer",fontWeight:800,fontSize:13,color:"#2671B8",fontFamily:"inherit"}}>Download a copy</button>
          <button onClick={doDelete} style={{flex:1,minWidth:140,background:delArm?"#FF7675":"#FFF5F5",border:"2px solid "+(delArm?"#FF7675":"#FFC0C0"),borderRadius:12,padding:"11px",cursor:"pointer",fontWeight:800,fontSize:13,color:delArm?"white":"#CC3333",fontFamily:"inherit"}}>{delArm?"Tap again to erase everything":"Delete all data"}</button>
        </div>
      </div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
