// ─────────────────────────────────────────────────────────────
//  SUPABASE — REST + AUTH + RPC
// ─────────────────────────────────────────────────────────────
let SB_URL="";let SB_KEY="";let SB_ON=false;let SB_JWT="";let SB_REFRESH="";  // JWT + refresh token set when a teacher is logged in
const authHdr=()=>SB_JWT?("Bearer "+SB_JWT):("Bearer "+SB_KEY);
const sbH=()=>({"apikey":SB_KEY,"Authorization":authHdr(),"Content-Type":"application/json","Prefer":"return=representation"});

// Refresh an expired teacher access token using the stored refresh token
const refreshSession=async()=>{
  if(!SB_REFRESH)return false;
  try{const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SB_REFRESH})});
    if(!r.ok)return false;const d=await r.json();
    if(d.access_token){SB_JWT=d.access_token;if(d.refresh_token)SB_REFRESH=d.refresh_token;return true;}
    return false;}catch{return false;}
};
// Identify which Supabase key was supplied. The "service_role" (or new-style
// "sb_secret_") key BYPASSES row-level security entirely — if it is shipped in
// the page, every teacher can read every classroom and anyone viewing source
// gets full database access. We detect it and refuse to connect.
const keyRole=k=>{
  try{
    const t=String(k||"").trim();
    if(/^sb_secret_/i.test(t))return "service_role";
    if(/^sb_publishable_/i.test(t))return "anon";
    const seg=t.split(".")[1];if(!seg)return "";
    const json=decodeURIComponent(escape(atob(seg.replace(/-/g,"+").replace(/_/g,"/"))));
    return (JSON.parse(json).role)||"";
  }catch{return "";}
};
// Coerce a REST/RPC result to an array. sbFetch returns `true` for an empty
// body and null on error, so list callers must never assume an array.
const asArr=v=>Array.isArray(v)?v:[];
// Last server error, surfaced to the user instead of a generic failure message.
// Declared before its first use (let is not hoisted).
let LAST_ERR="";
// authenticated table access (used by logged-in teachers; RLS enforces ownership)
// retries once after refreshing if the access token has expired (401)
const sbFetch=async(path,method="GET",body=null,extra={},_retry=false)=>{
  try{const opts={method,headers:{...sbH(),...extra}};if(body!==null)opts.body=JSON.stringify(body);
    const r=await fetch(SB_URL+"/rest/v1/"+path,opts);
    if(r.status===401&&!_retry&&SB_REFRESH){const ok=await refreshSession();if(ok)return sbFetch(path,method,body,extra,true);}
    if(!r.ok){const t=await r.text();LAST_ERR=path.split("?")[0]+": "+r.status+" "+t.slice(0,200);
      if(/column .* does not exist|schema cache/i.test(t))LAST_ERR="Your database is missing a column the app expects. Re-run focus-bridge-schema-secure.sql in the Supabase SQL Editor (safe to run again).";
      return null;}
    LAST_ERR="";
    const t=await r.text();return t?JSON.parse(t):true;}catch(e){LAST_ERR="Could not reach the database ("+(e&&e.message?e.message:"network error")+"). Check the Supabase URL/key in index.html and your connection.";return null;}
};
// RPC (used by anonymous students; functions enforce their own scoping)
const sbRpc=async(fn,args)=>{
  try{const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
    if(!r.ok){const t=await r.text();LAST_ERR=fn+": "+r.status+" "+t.slice(0,200);
      if(r.status===404)LAST_ERR="Database function \""+fn+"\" not found. Re-run focus-bridge-schema-secure.sql in the Supabase SQL Editor (it is safe to run again).";
      return null;}
    LAST_ERR="";const t=await r.text();return t?JSON.parse(t):true;}catch(e){LAST_ERR="Network error reaching the database.";return null;}
};
// Supabase Auth (GoTrue) REST
// Teachers sign in with a USERNAME. Supabase Auth needs an address-shaped
// identifier, so when no email is supplied we synthesize a non-routable internal
// one. Supplying a real email is optional and enables password recovery.
// Home-only build switch. When true, the classroom/teacher side is hidden
// entirely — used for store submissions where "Data Not Collected" must be
// literally true and no children's records touch a server.
const HOME_ONLY=(typeof window!=="undefined"&&window.FB_HOME_ONLY===true);
const AUTH_DOMAIN=(typeof window!=="undefined"&&window.FB_AUTH_DOMAIN)||"focusbridge.app";
// Build a valid email-shaped identifier from a username. Reserved TLDs such as
// .local / .test / .invalid are rejected by Supabase Auth, so a real TLD is used.
const uidClean=u=>String(u||"").trim().toLowerCase().replace(/[^a-z0-9._-]/g,"").replace(/^[._-]+|[._-]+$/g,"").replace(/\.{2,}/g,".");
const uidToAddr=u=>uidClean(u)+"@users."+AUTH_DOMAIN;
const authSignup=async(email,password)=>{
  try{const r=await fetch(SB_URL+"/auth/v1/signup",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    const d=await r.json();if(!r.ok)return{error:d.msg||d.error_description||d.error||"Sign-up failed."};
    return{user:d.user||d,token:d.access_token||(d.session&&d.session.access_token)||"",refresh:d.refresh_token||(d.session&&d.session.refresh_token)||""};}catch{return{error:"Network error during sign-up."};}
};
const authLogin=async(email,password)=>{
  try{const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    const d=await r.json();if(!r.ok)return{error:d.msg||d.error_description||d.error||"Login failed."};
    return{user:d.user,token:d.access_token,refresh:d.refresh_token};}catch{return{error:"Network error during login."};}
};
const testConnection=async(url,key)=>{
  try{const r=await fetch(url.replace(/\/+$/,"")+"/rest/v1/rpc/bs_get_classroom",{method:"POST",headers:{"apikey":key,"Authorization":"Bearer "+key,"Content-Type":"application/json"},body:JSON.stringify({p_code:"ZZZZZZ"})});
    if(r.status===200)return{ok:true};
    if(r.status===404)return{ok:false,msg:"Functions not found. Run focus-bridge-schema-secure.sql first."};
    if(r.status===401)return{ok:false,msg:"Invalid anon key."};
    return{ok:false,msg:"Connection failed (status "+r.status+")."};}catch(e){return{ok:false,msg:"Could not reach that URL."};}
};

const DB={
  // ---- student-side (anonymous, via RPC in secure mode) ----
  async getClassroom(code){const C=code.toUpperCase();
    if(SB_ON){const d=await sbRpc("bs_get_classroom",{p_code:C});if(!d||!d.length)return null;const c=d[0];return{name:c.name,tokenReward:c.token_reward,tokenGoal:c.token_goal,nameMode:c.name_mode||"full",schedule:c.schedule_json,rosterPick:!!c.roster_pick};}

const beep=(f,t=0,d=.12,type="sine",g=.1)=>{if(!SOUND_ON)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;o.connect(v);v.connect(AC.destination);const s=AC.currentTime+t;v.gain.setValueAtTime(g,s);v.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d+.03);}catch{}};

function App(){
  const [screen,setScreen]=useState("loading");
  const [sess,setSess]=useState(null);
  const [cls,setCls]=useState(null);
  const [dash,setDash]=useState({code:"",roster:[],students:{}});
  const [dashLoading,setDashLoading]=useState(false);
  const [dbMode,setDbMode]=useState("demo");
  const [a11y,setA11y]=useState({sound:true,read:false,rm:false,lg:false});

  useEffect(()=>{(async()=>{
    // Single hosted backend, configured in index.html. No per-user setup.
    const BU=(typeof window!=="undefined"&&window.FB_SUPABASE_URL)||"";
    const BK=(typeof window!=="undefined"&&window.FB_SUPABASE_KEY)||"";
    if(BU&&BK){
      if(keyRole(BK)==="service_role"){setScreen("badkey");return;}
      SB_URL=BU.replace(/\/+$/,"");SB_KEY=BK;SB_ON=true;setDbMode("supabase");
    }
    const saved=await DB.getA11y();if(saved){setA11y(saved);SOUND_ON=saved.sound!==false;}
    const s=await DB.getSession();
    if(s?.home){const c=await HOME.getClassroom();if(c){setSess(s);setCls(c);setScreen("student-app");return;}}
    if(s?.code&&s?.studentId){const c=await DB.getClassroom(s.code);if(c){setSess(s);setCls(c);setScreen("student-app");return;}}
    setScreen("landing");
  })();},[]);

  const updateA11y=async n=>{setA11y(n);SOUND_ON=n.sound!==false;await DB.saveA11y(n);};
  const onJoined=async(code,id,token,name,avatar,c)=>{const s={code,studentId:id,token,name,avatar};await DB.saveSession(s);setSess(s);setCls(c);setScreen("student-app");};
  const onSignOut=async()=>{const wasHome=sess?.home;await DB.clearSession();setSess(null);setCls(null);
    // A classroom student lands back on their class sign-in list (no code retyping).
    setScreen(wasHome?"landing":"student-join");};
  const resumeHome=async()=>{const p=await HOME.getProfile();const s={code:"HOME",studentId:"home-child",token:"home",name:p.childName||"",avatar:p.avatar||"🦊",home:true};await DB.saveSession(s);setSess(s);setCls({name:"Home",tokenReward:p.tokenReward,tokenGoal:p.tokenGoal,nameMode:"full"});ping("home-play");setScreen("student-app");};
  const enterHome=async()=>{if(await HOME.hasProfile())return resumeHome();setScreen("home-setup");};
  const enterPlay=async()=>{if(await HOME.hasProfile())return resumeHome();setScreen("kid-start");};
  const onKidPick=async(avatar)=>{await HOME.createProfile({childName:"",avatar,tokenReward:"Special time!",tokenGoal:5});await HOME.joinStudent("HOME","home-child","Me",avatar,SD.map(t=>({id:t.id,done:false})));const s={code:"HOME",studentId:"home-child",token:"home",name:"",avatar,home:true};await DB.saveSession(s);setSess(s);setCls({name:"Home",tokenReward:"Special time!",tokenGoal:5,nameMode:"full"});ping("home-play");setScreen("student-app");};
  const onHomeReady=async(name,avatar,reward)=>{const s={code:"HOME",studentId:"home-child",token:"home",name,avatar,home:true};await DB.saveSession(s);setSess(s);setCls({name:"Home",tokenReward:reward,tokenGoal:5,nameMode:"full"});setScreen("student-app");};
  const refreshHomeCls=async()=>{const c=await HOME.getClassroom();if(c)setCls(c);};
  const onHomeDeleteAll=async()=>{await DB.clearSession();setSess(null);setCls(null);setScreen("landing");};
  const onAccess=(code,roster,students,c)=>{setDash({code,roster,students});setCls(c);setScreen("dashboard");};
  const onRefresh=async()=>{setDashLoading(true);const{roster,students}=await DB.getClassStudents(dash.code);setDash(p=>({...p,roster,students}));setDashLoading(false);};

  if(screen==="loading")return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#FFF8F0"}}><style>{CSS}</style><div style={{fontSize:60,animation:"spin 2s linear infinite"}}>✨</div></div>;
  if(screen==="badkey")return (<div style={{minHeight:"100vh",background:"#FFF5F5",display:"flex",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"Nunito,sans-serif"}}><style>{CSS}</style>
    <div style={{background:"white",borderRadius:24,padding:34,maxWidth:620,boxShadow:"0 10px 40px rgba(0,0,0,.15)",border:"3px solid #FF7675"}}>
      <div style={{fontSize:46,marginBottom:10}}>🛑</div>
      <h2 style={{fontSize:22,fontWeight:900,color:"#CC3333",marginBottom:12}}>Wrong Supabase key — app stopped</h2>
      <p style={{fontSize:14.5,fontWeight:700,color:"#333",lineHeight:1.7,marginBottom:12}}>The key in <code>index.html</code> is the <b>service_role</b> (secret) key. That key ignores all database security rules, so <b>every teacher would see every classroom</b>, and anyone who views the page source would have full read/write access to all student data.</p>
      <div style={{background:"#FFFBEB",border:"2px solid #FFE08A",borderRadius:14,padding:16,fontSize:13.5,fontWeight:700,color:"#8a6d00",lineHeight:1.8}}>
        <b>How to fix:</b><br/>
        1. In Supabase go to <b>Project Settings → API Keys</b>.<br/>
        2. Copy the key labelled <b>anon</b> / <b>public</b> (NOT service_role, NOT secret).<br/>
        3. Paste it into <code>window.FB_SUPABASE_KEY</code> in <code>index.html</code> and redeploy.<br/>
        4. In Supabase, <b>rotate the service_role key</b> — if it was ever published, treat it as compromised.
      </div>
    </div></div>);
  if(screen==="landing")return <Landing onPlay={enterPlay} onStudent={()=>setScreen("student-join")} onTeacher={()=>setScreen("teacher-auth")} onHome={enterHome}/>;
  if(screen==="student-join"&&!HOME_ONLY)return <Join dbMode={dbMode} onBack={()=>setScreen("landing")} onJoined={onJoined}/>;
  if(screen==="kid-start")return <KidStart onBack={()=>setScreen("landing")} onPick={onKidPick}/>;
  if(screen==="home-setup")return <HomeSetup onBack={()=>setScreen("landing")} onReady={onHomeReady}/>;
  if(screen==="home-parent")return <HomeParent cls={cls} onBack={()=>setScreen("student-app")} onChanged={refreshHomeCls} onDeleteAll={onHomeDeleteAll}/>;
  if(screen==="student-app")return <StudentApp sess={sess} cls={cls} a11y={a11y} updateA11y={updateA11y} onSignOut={onSignOut} db={sess?.home?HOME:DB} onParent={sess?.home?(()=>setScreen("home-parent")):null}/>;
  if(screen==="teacher-auth"&&!HOME_ONLY)return <TeacherAuth dbMode={dbMode} onBack={()=>setScreen("landing")} onAccess={onAccess}/>;
  if(screen==="dashboard")return <Dashboard {...dash} cls={cls} loading={dashLoading} dbMode={dbMode} onRefresh={onRefresh} onBack={()=>setScreen("teacher-auth")}/>;
  return null;
}

// ─────────────────────────────────────────────────────────────
//  JOIN  (with consent gate)
// ─────────────────────────────────────────────────────────────
function Join({dbMode,onBack,onJoined}){
  const [stage,setStage]=useState("code"); // code -> consent -> identity
  const [code,setCode]=useState("");const [cls,setCls]=useState(null);
  const [name,setName]=useState("");const [avatar,setAvatar]=useState("🦊");
  const [consent,setConsent]=useState(false);
  const [choices,setChoices]=useState([]);
  const [saved,setSaved]=useState(null);   // classes remembered on this device
  const [booting,setBooting]=useState(true);
  const [err,setErr]=useState("");const [loading,setLoading]=useState(false);

  // Open a class the device already knows: skip straight to the sign-in list.
  const openKnown=async(C)=>{
    setLoading(true);setErr("");
    const c=await DB.getClassroom(C);
    if(!c){setErr("That class is no longer available. Enter a code to continue.");setLoading(false);setStage("code");return;}
    setCode(C);setCls(c);
    const here=await DB.knownHere(C);
    let list=here;
    if(c.rosterPick){const all=await DB.listStudents(C);const seen={};list=[...here,...all].filter(x=>{if(seen[x.id])return false;seen[x.id]=1;return true;});}
    setChoices(list);setLoading(false);setStage(list.length?"who":"consent");
  };
  useEffect(()=>{(async()=>{
    const list=await DB.knownClasses();
    setSaved(list);
    if(list.length===1){await openKnown(list[0].code);}
    else if(list.length>1){setStage("class");}
    setBooting(false);
  })();},[]);
  const checkCode=async()=>{
    if(!code.trim()){setErr("Please enter your class code.");return;}
    const C=code.trim().toUpperCase();setLoading(true);setErr("");
    const c=await DB.getClassroom(C);setLoading(false);
    if(!c){setErr(LAST_ERR?("Could not reach the classroom. "+LAST_ERR):"That code does not match any classroom. Check with your teacher!");return;}
    setCls(c);
    const here=await DB.knownHere(C);
    let list=here;
    if(c.rosterPick){const all=await DB.listStudents(C);
      const seen={};list=[...here,...all].filter(x=>{if(seen[x.id])return false;seen[x.id]=1;return true;});}
    setChoices(list);
    setStage(list.length?"who":"consent");
  };
  // Sign back in to an existing profile: name + avatar resume the same record.
  const resume=async(p)=>{
    const C=code.trim().toUpperCase();setLoading(true);setErr("");
    const csched=await DB.getSchedule(C);const base=(csched&&csched.length)?csched:SD;
    const res=await DB.joinStudent(C,p.id,p.name,p.avatar,base.map(t=>({id:t.id,done:false})));
    if(!res){setErr(LAST_ERR||"Could not sign in. Please try again.");setLoading(false);return;}
    await DB.rememberHere(C,{id:res.id,name:p.name,avatar:p.avatar});
    await DB.rememberClass(C,cls?.name);
    setLoading(false);onJoined(C,res.id,res.token,p.name,p.avatar,cls);
  };
  const join=async()=>{
    if(!name.trim()){setErr("Please enter a first name.");return;}
    const fn=firstName(name);
    const C=code.trim().toUpperCase();setLoading(true);setErr("");
    const csched=await DB.getSchedule(C);const base=(csched&&csched.length)?csched:SD;
    const res=await DB.joinStudent(C,genId(),fn,avatar,base.map(t=>({id:t.id,done:false})));
    if(!res){setErr(LAST_ERR||"Could not join. Please try again.");setLoading(false);return;}
    await DB.recordConsent(C,res.id,fn,"school_authorized","Confirmed by supervising adult at join");
    ping("class-join");
    await DB.rememberHere(C,{id:res.id,name:fn,avatar});
    await DB.rememberClass(C,cls?.name);
    setLoading(false);onJoined(C,res.id,res.token,fn,avatar,cls);
  };

  return(<div style={{minHeight:"100vh",background:"linear-gradient(155deg,#FFF8F0,#F0F9FF 55%,#FEF0FA)",display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"Nunito,sans-serif"}}><style>{CSS}</style>
    <div style={{background:"white",borderRadius:28,padding:36,width:"100%",maxWidth:460,boxShadow:"0 8px 40px rgba(0,0,0,.1)"}}>
      <button onClick={onBack} style={{background:"#f5f5f5",border:"none",borderRadius:12,padding:"8px 16px",cursor:"pointer",fontWeight:800,fontSize:13,fontFamily:"inherit",color:"#888",marginBottom:24}}>Back</button>

      {booting&&<div style={{textAlign:"center",padding:"30px 0"}}><div style={{fontSize:40,animation:"spin 2s linear infinite"}}>✨</div></div>}

      {!booting&&stage==="class"&&<>
        <div style={{textAlign:"center",marginBottom:18}}><div style={{fontSize:44,marginBottom:8}}>🎒</div><div style={{fontSize:23,fontWeight:900,color:"#FF8C69"}}>Which class?</div></div>
        {(saved||[]).map(k=><button key={k.code} onClick={()=>openKnown(k.code)} disabled={loading} className="lift" style={{width:"100%",background:"#FFF8F0",border:"2.5px solid #FFD9C0",borderRadius:16,padding:"14px 16px",marginBottom:9,cursor:"pointer",fontFamily:"inherit",textAlign:"left",display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:26}}>🏫</span><span style={{flex:1}}><span style={{display:"block",fontWeight:900,fontSize:15,color:"#333"}}>{k.name}</span><span style={{fontSize:12,fontWeight:700,color:"#aaa"}}>Code {k.code}</span></span><span style={{fontSize:20,color:"#FFB08A"}}>→</span>
        </button>)}
        <Err msg={err}/>
        <button onClick={()=>{setErr("");setStage("code");}} style={{width:"100%",background:"#f5f5f5",border:"2px dashed #ccc",borderRadius:16,padding:"12px",cursor:"pointer",fontWeight:800,fontSize:13,color:"#777",fontFamily:"inherit"}}>Use a different class code</button>
      </>}

      {!booting&&stage==="code"&&<>
        {dbMode!=="supabase"&&<div style={{background:"#FFF3E0",border:"2px solid #FFD700",borderRadius:12,padding:"10px 13px",marginBottom:14,fontSize:11.5,fontWeight:700,color:"#8a6d00",lineHeight:1.5}}>Demo mode: this device only. Your teacher will not see this on their device unless they have connected a database.</div>}
        <div style={{textAlign:"center",marginBottom:26}}><div style={{fontSize:48,marginBottom:8}}>🎒</div><div style={{fontSize:24,fontWeight:900,color:"#FF8C69"}}>Join Your Class</div></div>
        <div style={{marginBottom:14}}><label style={{fontWeight:800,fontSize:14,color:"#333",display:"block",marginBottom:8}}>Class Code</label>
        <input value={code} onChange={e=>setCode(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6))} placeholder="e.g. ABC123" maxLength={6} style={{width:"100%",padding:"14px",border:"2.5px solid #e8e8e8",borderRadius:14,fontFamily:"inherit",fontWeight:900,fontSize:28,letterSpacing:"8px",textAlign:"center",textTransform:"uppercase"}} onFocus={e=>e.target.style.borderColor="#FF8C69"} onBlur={e=>e.target.style.borderColor="#e8e8e8"}/></div>
        <Err msg={err}/><Btn onClick={checkCode} disabled={loading} full>{loading?"Checking...":"Next"}</Btn>
      </>}

      {stage==="who"&&<>
        <div style={{textAlign:"center",marginBottom:18}}><div style={{fontSize:44,marginBottom:8}}>👋</div><div style={{fontSize:23,fontWeight:900,color:"#FF8C69"}}>Tap your name!</div><div style={{fontSize:13,fontWeight:700,color:"#aaa",marginTop:5}}>Sign back in to keep your stars</div></div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(104px,1fr))",gap:10,marginBottom:16}}>
          {choices.map(p=><button key={p.id} onClick={()=>resume(p)} disabled={loading} className="lift" style={{background:"#FFF8F0",border:"2.5px solid #FFD9C0",borderRadius:18,padding:"14px 6px",cursor:loading?"wait":"pointer",fontFamily:"inherit",textAlign:"center"}}>
            <div style={{fontSize:38,lineHeight:1}}>{p.avatar}</div>
            <div style={{fontSize:13,fontWeight:900,color:"#333",marginTop:6,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
          </button>)}
        </div>
        <Err msg={err}/>
        <button onClick={()=>setStage("consent")} style={{width:"100%",background:"#f5f5f5",border:"2px dashed #ccc",borderRadius:16,padding:"13px",cursor:"pointer",fontWeight:800,fontSize:14,color:"#777",fontFamily:"inherit"}}>➕ I'm new — make my profile</button>
        <div style={{textAlign:"center",marginTop:12}}><button onClick={()=>{setErr("");setChoices([]);setStage((saved&&saved.length>1)?"class":"code");}} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,fontWeight:800,color:"#bbb",fontFamily:"inherit",textDecoration:"underline"}}>Use a different class</button></div>
      </>}

      {stage==="consent"&&<>
        <div style={{textAlign:"center",marginBottom:18}}><div style={{fontSize:44,marginBottom:8}}>🔒</div><div style={{fontSize:20,fontWeight:900,color:"#27AE60"}}>Before we start</div></div>
        <div style={{background:"#F8FFF8",border:"2px solid #A8E6CF",borderRadius:14,padding:16,marginBottom:16,fontSize:13,fontWeight:700,color:"#333",lineHeight:1.6}}>
          Focus Bridge will save this student's activity (tasks, feelings, rewards) so their teacher can see progress. We collect as little as possible and never sell data or use it for ads. A parent or school can review, export, or delete it anytime.
          <div style={{marginTop:8,fontSize:12,color:"#27AE60",fontWeight:800}}>Joining class: {cls?.name}</div>
        </div>
        <div onClick={()=>setConsent(c=>!c)} style={{display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer",marginBottom:16,background:consent?"#F0FFF4":"#fafafa",border:"2px solid "+(consent?"#27AE60":"#e8e8e8"),borderRadius:12,padding:12}}>
          <div style={{width:24,height:24,borderRadius:7,background:consent?"#27AE60":"white",border:"2px solid "+(consent?"#27AE60":"#ccc"),display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:900,flexShrink:0,marginTop:1}}>{consent?"✓":""}</div>
          <div style={{fontSize:13,fontWeight:700,color:"#333",lineHeight:1.5}}>A teacher or parent is present and consents to this student using Focus Bridge and to their activity being saved for educational use.</div>
        </div>
        <div style={{fontSize:11,color:"#aaa",fontWeight:700,marginBottom:14,textAlign:"center"}}>This consent is recorded with a timestamp. Schools and parents retain full rights over the data.</div>
        <Err msg={err}/>
        <Btn onClick={()=>{if(!consent){setErr("A supervising adult must consent to continue.");return;}setErr("");setStage("identity");}} col="#27AE60" full>Continue</Btn>
      </>}

      {stage==="identity"&&<>
        <div style={{textAlign:"center",marginBottom:20}}><div style={{fontSize:44,marginBottom:8}}>{avatar}</div><div style={{fontSize:22,fontWeight:900,color:"#FF8C69"}}>Who is this?</div></div>
        <TxtInput label={cls?.nameMode==="id"?"Student ID or nickname":"First name only"} value={name} onChange={e=>setName(e.target.value.slice(0,30))} placeholder={cls?.nameMode==="id"?"e.g. a nickname":"e.g. Alex"}/>
        <div style={{marginBottom:20}}>
          <div style={{fontWeight:800,fontSize:14,color:"#333",marginBottom:10}}>Pick an Avatar</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:7}}>{AVS.map(av=><button key={av} onClick={()=>setAvatar(av)} style={{fontSize:28,padding:"8px 0",border:"none",cursor:"pointer",background:avatar===av?"#FF8C6920":"transparent",borderRadius:12,outline:avatar===av?"3px solid #FF8C69":"3px solid transparent"}}>{av}</button>)}</div>
        </div>
        <Err msg={err}/><Btn onClick={join} disabled={loading} full>{loading?"Joining...":"Start!"}</Btn>
      </>}
    </div></div>);
}

// ─────────────────────────────────────────────────────────────
//  TEACHER AUTH — real accounts in secure mode; PIN in demo mode
// ─────────────────────────────────────────────────────────────
function TeacherAuth({dbMode,onBack,onAccess}){
  const secure=dbMode==="supabase";
  const [mode,setMode]=useState(secure?"login":"access"); // secure: login|signup ; demo: create|access
  const [user,setUser]=useState("");const [mail,setMail]=useState("");const [pw,setPw]=useState("");
  const [cn,setCn]=useState("");const [tn,setTn]=useState("");const [tr,setTr]=useState("");const [nameMode,setNameMode]=useState("full");const [sch,setSch]=useState("");const [zip,setZip]=useState("");
  const [pin,setPin]=useState("");const [ac,setAc]=useState("");const [ap,setAp]=useState("");
  const [created,setCreated]=useState("");const [classes,setClasses]=useState(null);
  const [loading,setLoading]=useState(false);const [err,setErr]=useState("");const [info,setInfo]=useState("");const [copied,setCopied]=useState(false);

  // SECURE: sign up -> create auth user, then a classroom
  const signup=async()=>{
    if(!user.trim()||pw.length<6||!cn.trim()||!tn.trim()){setErr("Enter a username, a 6+ char password, your name, and a class name.");return;}
    if(uidClean(user).length<3){setErr("Username must be at least 3 characters (letters, numbers, dots, dashes, underscores).");return;}
    if(!sch.trim()){setErr("Please enter your school name.");return;}
    if(!/^\d{5}$/.test(zip.trim())){setErr("Please enter a 5-digit ZIP code.");return;}
    setLoading(true);setErr("");setInfo("");
    const a=await authSignup(mail.trim()||uidToAddr(user),pw);
    if(a.error){setErr((/invalid/i.test(a.error)&&!mail.trim())?("Sign-up rejected by the server: "+a.error+" Try a simpler username (letters and numbers only), or set window.FB_AUTH_DOMAIN in index.html to a domain you own."):a.error);setLoading(false);return;}
    if(!a.token){setInfo(mail.trim()?"Account created. Check your email to confirm, then log in.":"Account created, but it needs confirmation. Since you signed up without an email, turn OFF Authentication > Providers > Email > Confirm email in Supabase, then sign up again.");setMode("login");setLoading(false);return;}
    SB_JWT=a.token;SB_REFRESH=a.refresh||"";SB_USER_ID=a.user?.id||"";
    const code=genCode();
    const ok=await DB.createClassroom(code,{name:cn.trim(),teacherName:tn.trim(),tokenReward:tr.trim()||"Special Reward!",tokenGoal:5,nameMode,schoolName:sch.trim(),zip:zip.trim()},SB_USER_ID);
    if(!ok){setErr("Account made, but classroom creation failed. "+(LAST_ERR||"Try logging in."));setLoading(false);return;}
    setCreated(code);setLoading(false);
  };
  // SECURE: login -> list my classrooms
  const login=async()=>{
    if(!user.trim()&&!mail.trim()){setErr("Enter your username (or email) and password.");return;}
    setLoading(true);setErr("");setInfo("");
    const a=await authLogin(mail.trim()||uidToAddr(user),pw);
    if(a.error){setErr(a.error);setLoading(false);return;}
    SB_JWT=a.token;SB_REFRESH=a.refresh||"";SB_USER_ID=a.user?.id||"";
    const list=await DB.listMyClassrooms();setClasses(list);setLoading(false);
    if(!list.length)setInfo("No classrooms yet — switch to Create a Classroom.");
  };
  const openClass=async(c)=>{
    setLoading(true);await DB.audit(c.code,"viewed_roster","");
    const{roster,students}=await DB.getClassStudents(c.code);setLoading(false);onAccess(c.code,roster,students,c);
  };
  // DEMO: create / access via PIN (no real data)
  const demoCreate=async()=>{
    if(!cn.trim()||!tn.trim()||pin.length!==4){setErr("Fill all fields and a 4-digit PIN.");return;}
    if(!sch.trim()){setErr("Please enter your school name.");return;}
    if(!/^\d{5}$/.test(zip.trim())){setErr("Please enter a 5-digit ZIP code.");return;}
    setLoading(true);setErr("");const code=genCode();
    await DB.createClassroom(code,{name:cn.trim(),teacherName:tn.trim(),pin,tokenReward:tr.trim()||"Special Reward!",tokenGoal:5,nameMode,schoolName:sch.trim(),zip:zip.trim()});
    // demo stores pin in the class object
    const c=await sGet("bs-class-"+code,true);await sSet("bs-class-"+code,{...c,pin},true);
    setCreated(code);setLoading(false);
  };
  const demoAccess=async()=>{
    if(!ac.trim()||ap.length!==4){setErr("Enter the class code and 4-digit PIN.");return;}
    setLoading(true);setErr("");const code=ac.trim().toUpperCase();
    const c=await DB.getClassroomOwned(code);
    if(!c){setErr("Classroom not found.");setLoading(false);return;}
    if(c.pin!==ap){setErr("Incorrect PIN.");setLoading(false);return;}
    const{roster,students}=await DB.getClassStudents(code);setLoading(false);onAccess(code,roster,students,c);
  };
  const copy=()=>{navigator.clipboard.writeText(created).catch(()=>{});setCopied(true);setTimeout(()=>setCopied(false),2000);};

  const TABBTN=(m,l)=><button onClick={()=>{setMode(m);setErr("");setInfo("");setCreated("");setClasses(null);}} style={{flex:1,padding:"11px",border:"none",cursor:"pointer",background:mode===m?"#27AE60":"transparent",color:mode===m?"white":"#888",borderRadius:12,fontWeight:900,fontSize:14,fontFamily:"inherit"}}>{l}</button>;

  return(<div style={{minHeight:"100vh",background:"linear-gradient(155deg,#F0FFF4,#E8F8F5 55%,#F0F9FF)",display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"Nunito,sans-serif"}}><style>{CSS}</style>
    <div style={{background:"white",borderRadius:28,padding:36,width:"100%",maxWidth:480,boxShadow:"0 8px 40px rgba(0,0,0,.1)"}}>
      <button onClick={onBack} style={{background:"#f5f5f5",border:"none",borderRadius:12,padding:"8px 16px",cursor:"pointer",fontWeight:800,fontSize:13,fontFamily:"inherit",color:"#888",marginBottom:24}}>Back</button>
      <div style={{textAlign:"center",marginBottom:18}}><div style={{fontSize:48,marginBottom:8}}>{secure?"🔒":"📊"}</div><div style={{fontSize:22,fontWeight:900,color:"#27AE60"}}>Teacher {secure?"Login":"Access"}</div>{!secure&&<div style={{marginTop:8,fontSize:12,fontWeight:700,color:"#F57C00",background:"#FFF3E0",borderRadius:10,padding:"7px 12px"}}>Offline demo mode — this device only, not for real student data. The classroom server is not configured for this copy of the app.</div>}</div>

      {secure&&<div style={{display:"flex",background:"#f5f5f5",borderRadius:16,padding:4,marginBottom:22}}>{TABBTN("login","Log In")}{TABBTN("signup","Create Classroom")}</div>}
      {!secure&&<div style={{display:"flex",background:"#f5f5f5",borderRadius:16,padding:4,marginBottom:22}}>{TABBTN("create","Create Classroom")}{TABBTN("access","Access Dashboard")}</div>}

      {/* SECURE LOGIN */}
      {secure&&mode==="login"&&!classes&&<div>
        <TxtInput label="Username" value={user} onChange={e=>setUser(e.target.value)} placeholder="Your username" green/>
        <TxtInput label="Password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Your password" green type="password"/>
        <div style={{fontSize:11.5,fontWeight:700,color:"#aaa",marginTop:-6,marginBottom:12}}>Signed up with an email instead? Enter it as your username.</div>
        <Err msg={err}/><Ok msg={info}/><Btn onClick={login} disabled={loading} col="#27AE60" full>{loading?"Signing in...":"Log In"}</Btn>
      </div>}
      {secure&&classes&&<div>
        <div style={{fontWeight:900,fontSize:15,marginBottom:12}}>Your Classrooms</div>
        {classes.length===0&&<div style={{fontSize:13,color:"#aaa",fontWeight:700,marginBottom:12}}>No classrooms yet.</div>}
        {classes.map(c=><div key={c.code} onClick={()=>openClass(c)} className="lift" style={{display:"flex",alignItems:"center",gap:12,background:"#F8FFF8",border:"2px solid #A8E6CF",borderRadius:14,padding:14,marginBottom:10,cursor:"pointer"}}><div style={{flex:1}}><div style={{fontWeight:800,fontSize:15}}>{c.name}</div><div style={{fontSize:12,color:"#888",fontWeight:700}}>Code: {c.code}</div></div><div style={{fontSize:18}}>→</div></div>)}
        <button onClick={()=>{setClasses(null);setMode("signup");}} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,fontWeight:800,color:"#27AE60",fontFamily:"inherit",marginTop:4}}>+ Create another classroom</button>
      </div>}

      {/* SECURE SIGNUP */}
      {secure&&mode==="signup"&&!created&&<div>
        <TxtInput label="Username" value={user} onChange={e=>setUser(e.target.value)} placeholder="e.g. msjones4b" green/>
        <TxtInput label="Password (6+ characters)" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Choose a password" green type="password"/>
        <TxtInput label="Recovery email (optional)" value={mail} onChange={e=>setMail(e.target.value)} placeholder="Leave blank to skip" green/>
        <div style={{background:"#FFFBEB",border:"2px solid #FFE08A",borderRadius:11,padding:"9px 12px",marginBottom:14,fontSize:11.5,fontWeight:700,color:"#8a6d00",lineHeight:1.5}}>No email is required. If you leave it blank, your password <b>cannot be reset</b> — write it down somewhere safe.</div>
        <TxtInput label="Classroom Name" value={cn} onChange={e=>setCn(e.target.value)} placeholder="e.g. Room 4B Morning Stars" green/>
        <TxtInput label="Your Name" value={tn} onChange={e=>setTn(e.target.value)} placeholder="Your name" green/>
        <TxtInput label="Token Reward (optional)" value={tr} onChange={e=>setTr(e.target.value)} placeholder="e.g. 10 mins of free play" green/>
        <TxtInput label="School Name" value={sch} onChange={e=>setSch(e.target.value)} placeholder="e.g. Lincoln Elementary" green/>
        <TxtInput label="School ZIP Code" value={zip} onChange={e=>setZip(e.target.value.replace(/\D/g,"").slice(0,5))} placeholder="5 digits" green/>
        <div style={{background:"#F8FFF8",border:"2px solid #A8E6CF",borderRadius:11,padding:"9px 12px",marginBottom:14,fontSize:11.5,fontWeight:700,color:"#1A6B3C",lineHeight:1.5}}>Your school name and ZIP are used only to report how widely Focus Bridge is used (for example, how many schools and regions). They are never shown to students or families, never sold, and never used for advertising.</div>
        <NameModePicker value={nameMode} set={setNameMode}/>
        <Err msg={err}/><Ok msg={info}/><Btn onClick={signup} disabled={loading} col="#27AE60" full>{loading?"Creating...":"Create Account & Classroom"}</Btn>
      </div>}

      {/* DEMO CREATE */}
      {!secure&&mode==="create"&&!created&&<div>
        <TxtInput label="Classroom Name" value={cn} onChange={e=>setCn(e.target.value)} placeholder="e.g. Room 4B Morning Stars" green/>
        <TxtInput label="Your Name" value={tn} onChange={e=>setTn(e.target.value)} placeholder="Your name" green/>
        <TxtInput label="Token Reward (optional)" value={tr} onChange={e=>setTr(e.target.value)} placeholder="e.g. 10 mins of free play" green/>
        <TxtInput label="School Name" value={sch} onChange={e=>setSch(e.target.value)} placeholder="e.g. Lincoln Elementary" green/>
        <TxtInput label="School ZIP Code" value={zip} onChange={e=>setZip(e.target.value.replace(/\D/g,"").slice(0,5))} placeholder="5 digits" green/>
        <div style={{background:"#F8FFF8",border:"2px solid #A8E6CF",borderRadius:11,padding:"9px 12px",marginBottom:14,fontSize:11.5,fontWeight:700,color:"#1A6B3C",lineHeight:1.5}}>Your school name and ZIP are used only to report how widely Focus Bridge is used (for example, how many schools and regions). They are never shown to students or families, never sold, and never used for advertising.</div>
        <NameModePicker value={nameMode} set={setNameMode}/>
        <div style={{marginBottom:18}}><label style={{fontWeight:800,fontSize:13,color:"#333",display:"block",marginBottom:7}}>4-Digit PIN</label><input value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,"").slice(0,4))} placeholder="e.g. 1234" inputMode="numeric" style={{width:"100%",padding:"12px",border:"2px solid #e8e8e8",borderRadius:12,fontFamily:"inherit",fontWeight:900,fontSize:24,letterSpacing:"8px",textAlign:"center"}} onFocus={e=>e.target.style.borderColor="#27AE60"} onBlur={e=>e.target.style.borderColor="#e8e8e8"}/></div>
        <Err msg={err}/><Btn onClick={demoCreate} disabled={loading} col="#27AE60" full>{loading?"Creating...":"Create Classroom"}</Btn>
      </div>}

      {/* CREATED confirmation (both modes) */}
      {created&&<div style={{textAlign:"center"}}>
        <div style={{background:"linear-gradient(135deg,#27AE60,#2ECC71)",borderRadius:20,padding:26,marginBottom:18}}>
          <div style={{fontSize:38,marginBottom:8}}>🎉</div><div style={{fontSize:16,fontWeight:900,color:"white",marginBottom:12}}>Classroom Created!</div>
          <div style={{background:"rgba(255,255,255,.22)",borderRadius:14,padding:"12px 20px",marginBottom:12}}><div style={{fontSize:11,color:"rgba(255,255,255,.75)",fontWeight:700,marginBottom:4,letterSpacing:"2px"}}>CLASS CODE</div><div style={{fontSize:40,fontWeight:900,color:"white",letterSpacing:"8px"}}>{created}</div></div>
          <button onClick={copy} style={{background:"rgba(255,255,255,.26)",border:"none",borderRadius:12,padding:"9px 20px",color:"white",fontWeight:800,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{copied?"Copied!":"Copy Code"}</button>
        </div>
        <Btn onClick={async()=>{await DB.audit(created,"viewed_roster","");const{roster,students}=await DB.getClassStudents(created);const c=await DB.getClassroomOwned(created);onAccess(created,roster,students,c);}} col="#27AE60" full>Open Dashboard</Btn>
      </div>}

      {/* DEMO ACCESS */}
      {!secure&&mode==="access"&&<div>
        <div style={{marginBottom:14}}><label style={{fontWeight:800,fontSize:13,color:"#333",display:"block",marginBottom:7}}>Classroom Code</label><input value={ac} onChange={e=>setAc(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6))} placeholder="e.g. ABC123" style={{width:"100%",padding:"12px",border:"2px solid #e8e8e8",borderRadius:12,fontFamily:"inherit",fontWeight:900,fontSize:26,letterSpacing:"7px",textAlign:"center",textTransform:"uppercase"}} onFocus={e=>e.target.style.borderColor="#27AE60"} onBlur={e=>e.target.style.borderColor="#e8e8e8"}/></div>
        <div style={{marginBottom:18}}><label style={{fontWeight:800,fontSize:13,color:"#333",display:"block",marginBottom:7}}>4-Digit PIN</label><input value={ap} onChange={e=>setAp(e.target.value.replace(/\D/g,"").slice(0,4))} placeholder="****" type="password" inputMode="numeric" style={{width:"100%",padding:"12px",border:"2px solid #e8e8e8",borderRadius:12,fontFamily:"inherit",fontWeight:900,fontSize:28,letterSpacing:"10px",textAlign:"center"}} onFocus={e=>e.target.style.borderColor="#27AE60"} onBlur={e=>e.target.style.borderColor="#e8e8e8"}/></div>
        <Err msg={err}/><Btn onClick={demoAccess} disabled={loading} col="#27AE60" full>{loading?"Loading...":"Access Dashboard"}</Btn>
      </div>}
    </div></div>);
}

function NameModePicker({value,set}){
  const opts=[["full","First name","Shows the child's first name"],["id","ID only","No name shown — most private"]];
  return(<div style={{marginBottom:16}}><label style={{fontWeight:800,fontSize:13,color:"#333",display:"block",marginBottom:7}}>How should students be shown? (privacy)</label>
    <div style={{fontSize:11,color:"#aaa",fontWeight:700,marginBottom:8}}>Focus Bridge only ever collects a first name. You can hide even that by choosing ID only.</div>
    {opts.map(([v,l,d])=><div key={v} onClick={()=>set(v)} style={{display:"flex",gap:10,alignItems:"center",cursor:"pointer",background:value===v?"#F0FFF4":"#fafafa",border:"2px solid "+(value===v?"#27AE60":"#eee"),borderRadius:11,padding:"9px 12px",marginBottom:7}}><div style={{width:18,height:18,borderRadius:"50%",border:"2px solid "+(value===v?"#27AE60":"#ccc"),background:value===v?"#27AE60":"white",flexShrink:0}}/><div><div style={{fontWeight:800,fontSize:13,color:"#333"}}>{l}</div><div style={{fontSize:11,color:"#aaa",fontWeight:700}}>{d}</div></div></div>)}
  </div>);
}

// ─────────────────────────────────────────────────────────────
//  STUDENT APP  (token-based saves, consent already recorded)
// ─────────────────────────────────────────────────────────────
function StudentApp({sess,cls,a11y,updateA11y,onSignOut,onParent,db=DB}){
  const [tab,setTab]=useState("home");
  const [token,setToken]=useState(sess.token||"demo");
  const [schedule,setSchedule]=useState(SD);const [pool,setPool]=useState(SD);
  const [cat,setCat]=useState("School");const [sentence,setSentence]=useState([]);const [lastSaid,setLastSaid]=useState("");
  const [emotion,setEmotion]=useState(null);
  const [stars,setStars]=useState(0);const [coins,setCoins]=useState(0);const [tokens,setTokens]=useState(0);
  const [streak,setStreak]=useState(0);const [lastActive,setLastActive]=useState("");
  const [unlocked,setUnlocked]=useState(new Set());const [pop,setPop]=useState("");const [badgeToast,setBadgeToast]=useState(null);
  const [aacN,setAacN]=useState(0);const [emoN,setEmoN]=useState(0);const [senN,setSenN]=useState(0);
  const [srN,setSrN]=useState(0);const [calmDone,setCalmDone]=useState([]);
  const [emoLog,setEmoLog]=useState([]);const [taskLog,setTaskLog]=useState([]);
  const [sync,setSync]=useState("ok");const [ready,setReady]=useState(false);
  const [stories,setStories]=useState([]);const [openStory,setOpenStory]=useState(null);
  const [showSettings,setShowSettings]=useState(false);const [exitArm,setExitArm]=useState(false);
  const [bPhase,setBPhase]=useState("idle");const [bRound,setBRound]=useState(0);
  const breathRef=useRef(null);
  const [tId,setTId]=useState(null);const [tSecs,setTSecs]=useState(0);const [tMax,setTMax]=useState(0);
  const saveRef=useRef(null);
  const deletedRef=useRef(false);   // once true, never write anything again
  const TG=cls?.tokenGoal||5;

  useEffect(()=>{
    (async()=>{
      const custom=await db.getSchedule(sess.code);
      const base=(custom&&custom.length)?custom:SD;
      // Same-device return: load by stored capability token (no name lookup).
      // Fallback: resume via name + avatar (used on a fresh device).
      let d=null;
      if(sess.token&&sess.token!=="demo"){d=await db.getStudent(sess.code,sess.studentId,sess.token);}
      if(!d){
        const res=await db.joinStudent(sess.code,sess.studentId,sess.name,sess.avatar,base.map(t=>({id:t.id,done:false})));
        d=res?.data;
        if(res?.token)setToken(res.token);
      }
      let merged=base.map(t=>({...t,uid:mkUid(),done:false}));
      if(d){
        setStars(d.stars||0);setCoins(d.coins||0);setTokens(d.tokens||0);
        setUnlocked(new Set(d.badges||[]));setEmoLog(d.emotionLog||[]);setTaskLog(d.taskLog||[]);
        setAacN(d.aacCount||0);setEmoN(d.emoCount||0);setSenN(d.sentenceCount||0);
        setSrN(d.storiesRead||0);setCalmDone(d.calmDone||[]);
        if(d.schedule&&d.schedule.length)merged=d.schedule.map(sv=>{const t=base.find(p=>p.id===sv.id);return t?{...t,uid:sv.uid||mkUid(),done:!!sv.done}:null;}).filter(Boolean);
        const today=todayISO();let st=d.streak||0;const la=d.lastActive||"";
        if(la===today){}else if(la===yesterISO()){st=st+1;}else{st=1;}
        setStreak(st);setLastActive(today);
        if(st>=3)setUnlocked(prev=>new Set([...prev,"streak_3"]));
      }else{setStreak(1);setLastActive(todayISO());}
      setPool(base);setSchedule(merged);
      setStories(asArr(await db.getStories(sess.code)));
      setReady(true);
    })();
    return()=>{if(breathRef.current)clearTimeout(breathRef.current);};
  },[]);

  const sk=schedule.map(t=>t.done?"1":"0").join(""),bk=[...unlocked].sort().join(",");
  useEffect(()=>{
    if(!ready||deletedRef.current)return;setSync("saving");
    if(saveRef.current)clearTimeout(saveRef.current);
    const snap={name:sess.name,avatar:sess.avatar,stars,coins,tokens,streak,lastActive,badges:[...unlocked],emotionLog:emoLog,taskLog,aacCount:aacN,emoCount:emoN,sentenceCount:senN,storiesRead:srN,calmDone,schedule:schedule.map(t=>({id:t.id,uid:t.uid,done:t.done})),lastSeen:new Date().toISOString()};
    saveRef.current=setTimeout(async()=>{if(deletedRef.current)return;const ok=await db.saveStudent(sess.code,sess.studentId,token,snap);if(!deletedRef.current)setSync(ok?"ok":"err");},2500);
  },[stars,coins,tokens,streak,bk,emoLog.length,taskLog.length,sk,aacN,emoN,senN,srN,calmDone.length,ready]);

  useEffect(()=>{if(!tId||tSecs<=0)return;const t=setTimeout(()=>setTSecs(v=>{if(v<=1){setTId(null);return 0;}return v-1;}),1000);return()=>clearTimeout(t);},[tId,tSecs]);

  const sayNow=t=>{if(!a11y.read)return;try{if(window.speechSynthesis){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.9;u.pitch=1.05;window.speechSynthesis.speak(u);}}catch{}};
  const unlock=id=>{setUnlocked(s=>{if(s.has(id))return s;const b=BD.find(x=>x.id===id);if(b){setBadgeToast(b);setTimeout(()=>setBadgeToast(null),3200);SFX.badge();}return new Set([...s,id]);});};
  const addStars=n=>setStars(p=>{const nx=p+n;if(nx>=50)unlock("super_star");return nx;});
  const celebrate=msg=>{setPop(msg);setTimeout(()=>setPop(""),2800);};
  const addTok=()=>setTokens(t=>{const nx=Math.min(t+1,TG);if(nx>=TG){unlock("token_champ");addStars(10);setCoins(c=>c+5);celebrate("Token Board Complete! +10 stars");setTimeout(()=>setTokens(0),2600);}return nx;});
  const toggleTask=uid=>{const task=schedule.find(t=>t.uid===uid);if(!task)return;const nd=!task.done;setSchedule(p=>p.map(t=>t.uid===uid?{...t,done:nd}:t));if(nd){SFX.done();sayNow(task.label+" done!");addStars(2);setCoins(c=>c+1);addTok();celebrate(task.emoji+" Done! +2 stars");setTaskLog(l=>[...l,{emoji:task.emoji,task:task.label,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),iso:todayISO()}]);const da=schedule.filter(t=>t.done&&t.uid!==uid).length+1;if(da===1)unlock("first_task");if(da>=4)unlock("morning_hero");if(da>=schedule.length){unlock("all_done");addStars(10);celebrate("ALL DONE! Amazing!");}}};
  // --- schedule builder: the child decides what is in their day and the order ---
  const addToDay=id=>{const t=pool.find(p=>p.id===id);if(!t)return;SFX.tap();setSchedule(p=>[...p,{...t,uid:mkUid(),done:false}]);};
  const removeFromDay=uid=>{SFX.tap();setSchedule(p=>p.filter(x=>x.uid!==uid));};
  const reorderDay=(from,to)=>{setSchedule(p=>{if(from===to||from<0||to<0||from>=p.length||to>=p.length)return p;const a=[...p];const [it]=a.splice(from,1);a.splice(to,0,it);return a;});};
  const moveInDay=(i,dir)=>{setSchedule(p=>{const a=[...p];const j=i+dir;if(j<0||j>=a.length)return p;const t=a[i];a[i]=a[j];a[j]=t;return a;});SFX.tap();};
  const startT=(uid,mins)=>{if(tId===uid){setTId(null);setTSecs(0);setTMax(0);return;}setTId(uid);setTSecs(mins*60);setTMax(mins*60);};
  const addWord=w=>{SFX.tap();sayNow(w);setSentence(p=>p.length>=8?p:[...p,w]);};
  const speak=()=>{if(!sentence.length)return;const txt=sentence.join(" ");try{if(window.speechSynthesis){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.rate=.82;u.pitch=1.1;window.speechSynthesis.speak(u);}}catch{}setLastSaid(txt);setSentence([]);addStars(1);const nx=senN+1;setSenN(nx);if(nx>=5)unlock("sentence_star");const nx2=aacN+1;setAacN(nx2);if(nx2>=5)unlock("great_talker");};
  const checkIn=em=>{SFX.tap();sayNow("You feel "+em.label);setEmotion(em);setEmoLog(l=>[...l,{emoji:em.emoji,label:em.label,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),date:new Date().toLocaleDateString(),iso:todayISO()}]);addStars(1);const nx=emoN+1;setEmoN(nx);if(nx>=3)unlock("feeling_star");};
  const markCalm=act=>setCalmDone(p=>{const n=p.includes(act)?p:[...p,act];if(n.length>=4)unlock("calm_master");return n;});
  const breathe=()=>{if(breathRef.current)clearTimeout(breathRef.current);let round=0;const cycle=phase=>{setBPhase(phase);const dur={inhale:4000,hold:2000,exhale:4000};breathRef.current=setTimeout(()=>{if(phase==="inhale")cycle("hold");else if(phase==="hold")cycle("exhale");else{round++;setBRound(round);if(round>=5){setBPhase("done");addStars(3);unlock("deep_breather");markCalm("breathing");celebrate("Great breathing! +3 stars");}else cycle("inhale");}},dur[phase]);};setBRound(0);cycle("inhale");};
  const finishStory=()=>{const nx=srN+1;setSrN(nx);addStars(2);if(nx>=3)unlock("story_reader");setOpenStory(null);celebrate("Story done! +2 stars");};
  const awardGame=(badgeId,st,co,msg)=>{addStars(st);setCoins(c=>c+co);unlock(badgeId);celebrate(msg);};
  const award=(n,msg)=>{addStars(n);celebrate(msg);};
  const handleExit=()=>{if(!exitArm){setExitArm(true);setTimeout(()=>setExitArm(false),2600);return;}onSignOut();};
  const exportMine=()=>{const snap={student:sess.name,classCode:sess.code,exportedAt:new Date().toISOString(),stars,coins,tokens,streak,badges:[...unlocked],emotionLog:emoLog,taskLog,storiesRead:srN,calmDone};download("my-focus-bridge-data.json",JSON.stringify(snap,null,2));};
  const [showDelGate,setShowDelGate]=useState(false);
  const [delBusy,setDelBusy]=useState(false);
  const deleteMe=async()=>{
    // Stop autosave FIRST. Progress saves on a 2.5s timer, so a pending write
    // would otherwise fire after the delete and recreate the data.
    deletedRef.current=true;
    if(saveRef.current){clearTimeout(saveRef.current);saveRef.current=null;}
    setDelBusy(true);
    if(sess.home){await HOME.deleteEverything();}
    else {await db.selfDelete(sess.studentId,token);await db.forgetHere?.(sess.code,sess.studentId);}
    await DB.clearSession();
    setDelBusy(false);
    onSignOut();
  };

  const done=schedule.filter(t=>t.done).length;
  const pct=schedule.length?Math.round((done/schedule.length)*100):0;
  const curTab=[HOME_TAB,...TABS].find(t=>t.id===tab);
  const syncCol={ok:"rgba(255,255,255,.6)",saving:"#FFD700",err:"#FF7675"}[sync];
  const first=schedule.find(t=>!t.done),then=schedule.find(t=>!t.done&&t.uid!==first?.uid);
  // No in-app animation switch. Motion is still reduced automatically when the
  // device itself is set to "reduce motion" (iOS/Android/Windows accessibility),
  // so motion-sensitive children stay protected without an extra setting.
  const osReduceMotion=(typeof window!=="undefined"&&window.matchMedia)?window.matchMedia("(prefers-reduced-motion: reduce)").matches:false;
  const rootCls=(osReduceMotion?"rm ":"")+(a11y.lg?"lg":"");

  return(
    <div className={rootCls} style={{fontFamily:"Nunito,sans-serif",background:"linear-gradient(155deg,#FFF8F0,#F0F9FF 55%,#FEF0FA)",minHeight:"100vh"}}>
      <style>{CSS}</style>
      {pop&&<Confetti/>}
      {pop&&<div style={{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",background:"white",borderRadius:28,padding:"20px 36px",textAlign:"center",fontSize:20,fontWeight:900,boxShadow:"0 16px 56px rgba(0,0,0,.22)",zIndex:9999,animation:"popIn .4s ease-out",whiteSpace:"nowrap"}}><div style={{fontSize:50,animation:"bounce .55s ease-in-out infinite"}}>🎊</div><div style={{marginTop:8}}>{pop}</div></div>}
      {badgeToast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#2c3e50",color:"white",borderRadius:18,padding:"12px 22px",fontSize:14,fontWeight:800,boxShadow:"0 8px 30px rgba(0,0,0,.3)",zIndex:9999,animation:"toastUp .35s ease-out",display:"flex",gap:9,alignItems:"center"}}><span style={{fontSize:24}}>{badgeToast.emoji}</span><span>Badge unlocked: {badgeToast.label}!</span></div>}
      {openStory&&<StoryReader story={openStory} onClose={()=>setOpenStory(null)} onFinish={finishStory}/>}

      <div style={{background:curTab?.col||"#FF8C69",padding:"10px 16px",display:"flex",alignItems:"center",gap:10,boxShadow:"0 2px 16px rgba(0,0,0,.12)",position:"sticky",top:0,zIndex:50,flexWrap:"wrap"}}>
        <div style={{width:34,height:34,borderRadius:"50%",background:"rgba(255,255,255,.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>{sess.avatar}</div>
        <div style={{flex:1,minWidth:0}}><div style={{color:"white",fontSize:13,fontWeight:900,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{sess.name||"Me"}</div><div style={{color:"rgba(255,255,255,.75)",fontSize:10,fontWeight:700}}>{sess.home?"Home":(cls?.name||"My Class")}</div></div>
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{[HOME_TAB,...TABS].map(t=><button key={t.id} onClick={()=>{SFX.tap();setTab(t.id);}} style={{background:tab===t.id?"rgba(255,255,255,.3)":"rgba(255,255,255,.1)",border:tab===t.id?"2px solid rgba(255,255,255,.6)":"2px solid transparent",borderRadius:20,padding:"5px 10px",cursor:"pointer",fontWeight:tab===t.id?900:700,fontSize:13,color:"white",fontFamily:"inherit",display:"flex",alignItems:"center",gap:4}}><span>{t.icon}</span><span>{t.label}</span></button>)}</div>
        <div style={{fontSize:10,fontWeight:800,color:syncCol,background:"rgba(0,0,0,.1)",borderRadius:9,padding:"3px 6px",flexShrink:0}}>{sync==="ok"?(SB_ON?"🔒":"✓"):sync==="saving"?"...":"!"}</div>
        <div style={{display:"flex",gap:5}}>{[["⭐",stars],["🪙",coins],["🔥",streak],["🎯",tokens+"/"+TG]].map(([i,v],k)=><div key={k} style={{background:"rgba(255,255,255,.22)",borderRadius:14,padding:"3px 8px",color:"white",fontWeight:800,fontSize:12,display:"flex",gap:2,alignItems:"center",flexShrink:0}}><span>{i}</span><span>{v}</span></div>)}</div>
        <button onClick={handleExit} title="Signs out. Your stars are saved — tap your name to come back." style={{background:exitArm?"#FF7675":"rgba(255,255,255,.18)",border:"none",borderRadius:9,padding:"4px 10px",cursor:"pointer",color:"white",fontSize:11,fontWeight:800,fontFamily:"inherit",flexShrink:0}}>{exitArm?"Sure?":"Exit"}</button>
      </div>

      {!ready&&<div style={{textAlign:"center",padding:60}}><div style={{fontSize:48,animation:"spin 2s linear infinite"}}>✨</div><div style={{marginTop:12,fontWeight:800,color:"#bbb"}}>Loading your stuff...</div></div>}

      {ready&&<div style={{maxWidth:720,margin:"0 auto",padding:"18px 16px 80px"}}>
        {tab==="home"&&<StudentDash sess={sess} setTab={setTab} done={done} total={schedule.length} pct={pct} stars={stars} coins={coins} streak={streak} tokens={tokens} TG={TG} badges={unlocked.size} totalBadges={BD.length} stories={(stories||[]).length} lastEmotion={emoLog.length?emoLog[emoLog.length-1]:null} calmDone={calmDone.length}/>}
        {tab==="schedule"&&<SchedView schedule={schedule} pool={pool} toggleTask={toggleTask} pct={pct} done={done} tId={tId} tSecs={tSecs} tMax={tMax} startT={startT} first={first} then={then} addToDay={addToDay} removeFromDay={removeFromDay} moveInDay={moveInDay} reorderDay={reorderDay}/>}
        {tab==="talk"&&<TalkView cat={cat} setCat={setCat} sentence={sentence} addWord={addWord} delWord={()=>setSentence(p=>p.slice(0,-1))} clearSen={()=>setSentence([])} lastSaid={lastSaid} speak={speak}/>}
        {tab==="calm"&&<CalmView emotion={emotion} checkIn={checkIn} bPhase={bPhase} bRound={bRound} breathe={breathe} markCalm={markCalm} calmDone={calmDone} award={award}/>}
        {tab==="rewards"&&<RewardView stars={stars} coins={coins} streak={streak} tokens={tokens} TG={TG} reward={cls?.tokenReward} badges={BD} unlocked={unlocked}/>}
        {tab==="games"&&<GamesHub awardGame={awardGame}/>}
        {tab==="stories"&&<StoriesView stories={stories} onOpen={setOpenStory}/>}
      </div>}

      <button onClick={()=>setShowSettings(s=>!s)} style={{position:"fixed",bottom:18,right:18,width:52,height:52,borderRadius:"50%",border:"none",background:"white",boxShadow:"0 4px 20px rgba(0,0,0,.18)",fontSize:24,cursor:"pointer",zIndex:200}}>⚙️</button>
      {showSettings&&<div style={{position:"fixed",bottom:80,right:18,width:300,background:"white",borderRadius:20,padding:"16px 18px",boxShadow:"0 10px 40px rgba(0,0,0,.22)",zIndex:200,animation:"slideIn .25s ease-out"}}>
        <div style={{fontWeight:900,fontSize:15,marginBottom:6}}>Settings</div>
        <Toggle label="Sounds" desc="Chimes for taps and rewards" on={a11y.sound!==false} set={v=>updateA11y({...a11y,sound:v})}/>
        <Toggle label="Read aloud" desc="Speak buttons when tapped" on={!!a11y.read} set={v=>updateA11y({...a11y,read:v})}/>
        <Toggle label="Big text" desc="Make everything larger" on={!!a11y.lg} set={v=>updateA11y({...a11y,lg:v})}/>
        <button onClick={exportMine} style={{marginTop:10,width:"100%",background:"#EAF6FF",border:"2px solid #BdE0FF",borderRadius:11,padding:"9px",cursor:"pointer",fontWeight:800,fontSize:12,color:"#2671B8",fontFamily:"inherit"}}>Download my data</button>
        <button onClick={()=>setShowDelGate(true)} style={{marginTop:8,width:"100%",background:"#FFF5F5",border:"2px solid #FFC0C0",borderRadius:11,padding:"9px",cursor:"pointer",fontWeight:800,fontSize:12,color:"#CC3333",fontFamily:"inherit"}}>Delete my data</button>
        {showDelGate&&<ParentalGate onPass={()=>{setShowDelGate(false);deleteMe();}} onCancel={()=>setShowDelGate(false)}/>}
        {sess.home&&onParent&&<button onClick={()=>{setShowSettings(false);onParent();}} style={{marginTop:8,width:"100%",background:"#F0FFF4",border:"2px solid #A8E6CF",borderRadius:11,padding:"9px",cursor:"pointer",fontWeight:800,fontSize:12,color:"#1A6B3C",fontFamily:"inherit"}}>Grown-ups area 🔒</button>}
        <div style={{fontSize:10,color:"#bbb",fontWeight:700,marginTop:6,textAlign:"center"}}>{sess.home?"Grown-ups can manage or delete this data in the Grown-ups area.":"To delete this data, ask your teacher or parent."}</div>
      </div>}
    </div>
  );
}

      <div style={{width:64,height:64,borderRadius:"50%",background:"rgba(255,255,255,.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:36,flexShrink:0}}>{sess?.avatar||"\ud83e\udd8a"}</div>
      <div style={{flex:1,minWidth:150}}>

      </div>
      <div style={{background:"#f0f0f0",borderRadius:12,height:16,overflow:"hidden"}}><div style={{width:pct+"%",height:"100%",background:"linear-gradient(90deg,#FF8C69,#FFD700)",borderRadius:12,transition:"width .65s ease"}}/></div>
    </Card>}

    <div style={{fontWeight:900,fontSize:16,marginBottom:12,color:"#2c3e50"}}>Choose an activity</div>

      {cards.map(c=><button key={c.id} onClick={()=>{SFX.tap();setTab(c.id);}} className="lift" style={{background:c.bg,border:"3px solid "+c.col+"55",borderRadius:22,padding:"22px 12px",cursor:"pointer",fontFamily:"inherit",textAlign:"center",minHeight:148,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:7}}>
        <div style={{fontSize:48,lineHeight:1}}>{c.icon}</div>
        <div style={{fontSize:17,fontWeight:900,color:c.col}}>{c.title}</div>
        <div style={{fontSize:12,fontWeight:700,color:"#888",lineHeight:1.4}}>{c.sub}</div>
      </button>)}
    </div>
  </div>);
}

function SchedView({schedule,pool,toggleTask,pct,done,tId,tSecs,tMax,startT,first,then,addToDay,removeFromDay,moveInDay,reorderDay}){
  const [edit,setEdit]=useState(false);
  const [dragIdx,setDragIdx]=useState(-1);
  const listRef=useRef(null);
  const drag=useRef({on:false,from:-1});
  const countOf=id=>schedule.filter(x=>x.id===id).length;

  const downHandle=(e,i)=>{
    e.preventDefault();e.stopPropagation();
    drag.current={on:true,from:i};setDragIdx(i);SFX.tap();
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch{}
  };
  const moveHandle=e=>{
    if(!drag.current.on)return;
    e.preventDefault();
    const y=e.clientY;const nodes=listRef.current?Array.from(listRef.current.children):[];
    let target=-1;
    for(let k=0;k<nodes.length;k++){const r=nodes[k].getBoundingClientRect();if(y>=r.top&&y<=r.bottom){target=k;break;}}
    if(target>=0&&target!==drag.current.from){reorderDay(drag.current.from,target);drag.current.from=target;setDragIdx(target);}
  };

  return(<div style={{animation:"slideIn .3s ease-out"}}>

      <div style={{fontSize:20,color:"rgba(255,255,255,.7)",fontWeight:900}}>{"\u2192"}</div>
      <div style={{flex:1,background:"rgba(255,255,255,.18)",borderRadius:12,padding:"9px 12px",textAlign:"center",opacity:then?1:.6}}><div style={{fontSize:26}}>{then?.emoji||"\ud83c\udf89"}</div><div style={{fontSize:11,fontWeight:800,color:"white",marginTop:3}}>{then?.label||"All Done!"}</div></div>
    </div>}

    {!edit&&<Card style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><span style={{fontWeight:800,fontSize:15}}>My Day</span><span style={{fontSize:24,fontWeight:900,color:"#FF8C69"}}>{pct}%</span></div>
      <div style={{background:"#f0f0f0",borderRadius:12,height:18,overflow:"hidden"}}><div style={{width:pct+"%",height:"100%",background:"linear-gradient(90deg,#FF8C69,#FFD700)",borderRadius:12,transition:"width .65s ease"}}/></div>
      <div style={{marginTop:6,fontSize:12,color:"#ccc",textAlign:"right",fontWeight:700}}>{done} of {schedule.length} done</div>
    </Card>}

    {/* big, obvious build button */}
    <button onClick={()=>{SFX.tap();setEdit(e=>!e);}} style={{width:"100%",marginBottom:14,border:"none",borderRadius:22,padding:"18px 20px",cursor:"pointer",fontFamily:"inherit",color:"white",display:"flex",alignItems:"center",justifyContent:"center",gap:12,
      background:edit?"linear-gradient(135deg,#27AE60,#2ECC71)":"linear-gradient(135deg,#FF8C69,#FFB347)",
      boxShadow:edit?"0 6px 24px rgba(39,174,96,.4)":"0 6px 24px rgba(255,140,105,.4)"}}>
      <span style={{fontSize:30,lineHeight:1}}>{edit?"\u2705":"\u270f\ufe0f"}</span>
      <span style={{textAlign:"left"}}>
        <span style={{display:"block",fontSize:19,fontWeight:900}}>{edit?"I'm finished building!":"Build My Day"}</span>
        <span style={{display:"block",fontSize:12.5,fontWeight:700,opacity:.9}}>{edit?"Tap here when your day looks right":"Choose your activities and put them in order"}</span>
      </span>
    </button>

    {edit&&<Card style={{marginBottom:12,background:"#FFFBF5"}}>
      <div style={{fontSize:13.5,fontWeight:800,color:"#8a6d00",lineHeight:1.7}}>{"\ud83d\udc46"} Hold the <b>{"\u2630"}</b> handle and slide an activity up or down to move it. You can also tap the {"\u2191"} {"\u2193"} arrows, or {"\u2715"} to take something out.</div>
    </Card>}

    {schedule.length===0&&<Card style={{textAlign:"center",padding:34,marginBottom:14}}><div style={{fontSize:46,marginBottom:10}}>{"\ud83d\udcc5"}</div><div style={{fontWeight:900,fontSize:17,marginBottom:6}}>Your day is empty</div><div style={{fontSize:13,color:"#aaa",fontWeight:700}}>Tap <b>Build My Day</b> to add activities.</div></Card>}

    <div ref={listRef} style={{display:edit?"block":"grid",gridTemplateColumns:edit?undefined:"repeat(auto-fill,minmax(300px,1fr))",gap:edit?0:10}}>
      {schedule.map((task,i)=>{const active=tId===task.uid;const dragging=dragIdx===i;return(
        <div key={task.uid} onClick={()=>{if(!edit)toggleTask(task.uid);}} style={{background:dragging?"#FFF3E9":(task.done&&!edit?"linear-gradient(135deg,#F0FFF4,#E8F8F0)":"white"),borderRadius:18,padding:"12px 14px",marginBottom:edit?10:0,display:"flex",alignItems:"center",gap:11,
          boxShadow:dragging?"0 10px 28px rgba(232,116,59,.35)":(task.done&&!edit?"0 2px 8px rgba(39,174,96,.12)":"0 2px 10px rgba(0,0,0,.06)"),
          border:dragging?"2.5px solid #E8743B":(task.done&&!edit?"2px solid #A8E6CF":edit?"2px solid #FFE0CC":"2px solid transparent"),
          cursor:edit?"default":"pointer",transform:dragging?"scale(1.03)":"scale(1)",transition:dragging?"none":"all .2s"}}>

          {edit&&<div onPointerDown={e=>downHandle(e,i)} onPointerMove={moveHandle} onPointerUp={upHandle} onPointerCancel={upHandle}
            title="Hold and slide to move"
            style={{touchAction:"none",cursor:"grab",flexShrink:0,width:38,height:46,borderRadius:11,background:dragging?"#E8743B":"#FFF3E9",color:dragging?"white":"#E8743B",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:900,userSelect:"none"}}>{"\u2630"}</div>}

          {edit&&<div style={{display:"flex",flexDirection:"column",gap:3,flexShrink:0}}>
            <button onClick={e=>{e.stopPropagation();moveInDay(i,-1);}} disabled={i===0} style={{width:28,height:23,border:"none",borderRadius:6,background:"#f2f2f2",cursor:i===0?"not-allowed":"pointer",fontWeight:900,color:i===0?"#ddd":"#777",fontSize:12}}>{"\u2191"}</button>
            <button onClick={e=>{e.stopPropagation();moveInDay(i,1);}} disabled={i===schedule.length-1} style={{width:28,height:23,border:"none",borderRadius:6,background:"#f2f2f2",cursor:i===schedule.length-1?"not-allowed":"pointer",fontWeight:900,color:i===schedule.length-1?"#ddd":"#777",fontSize:12}}>{"\u2193"}</button>
          </div>}

          <div style={{width:26,height:26,borderRadius:"50%",background:"#FFF3E9",color:"#E8743B",fontWeight:900,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</div>
          <div style={{fontSize:30}}>{task.emoji}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontWeight:800,fontSize:14,color:task.done&&!edit?"#999":"#2c3e50",textDecoration:task.done&&!edit?"line-through":"none"}}>{task.label}</div></div>
          {!edit&&active&&tSecs>0&&<RingTimer secs={tSecs} maxSecs={tMax} size={66}/>}
          {!edit&&<div style={{width:26,height:26,borderRadius:"50%",background:task.done?"#4CAF50":"transparent",border:task.done?"none":"3px solid #e0e0e0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"white",fontWeight:900,flexShrink:0}}>{task.done?"\u2713":""}</div>}
          {!edit&&!task.done&&<button onClick={e=>{e.stopPropagation();startT(task.uid,task.mins);}} style={{background:active?"#FF8C69":"#f5f5f5",border:"none",borderRadius:9,padding:"4px 9px",cursor:"pointer",fontSize:12,fontWeight:800,color:active?"white":"#bbb",fontFamily:"inherit",flexShrink:0}}>{active?"Stop":"Time"}</button>}
          {edit&&<button onClick={e=>{e.stopPropagation();removeFromDay(task.uid);}} style={{background:"#FFF5F5",border:"2px solid #FFC0C0",borderRadius:9,padding:"5px 11px",cursor:"pointer",fontSize:13,fontWeight:900,color:"#CC3333",fontFamily:"inherit",flexShrink:0}}>{"\u2715"}</button>}
        </div>);})}
    </div>

    {edit&&<Card style={{marginTop:4}}>
      <div style={{fontWeight:900,fontSize:14,marginBottom:4}}>Add to my day</div>
      <div style={{fontSize:12,color:"#aaa",fontWeight:700,marginBottom:12}}>Tap to add. You can add the same thing more than once \u2014 like brushing teeth in the morning and at night.</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(112px,1fr))",gap:9}}>
        {(pool||[]).map(t=>{const n=countOf(t.id);return(
        <button key={t.id} onClick={()=>addToDay(t.id)} className="lift" style={{position:"relative",background:"#F7FBFF",border:"2px solid #Bde0FF",borderRadius:16,padding:"14px 6px",cursor:"pointer",fontFamily:"inherit",textAlign:"center"}}>
          {n>0&&<div style={{position:"absolute",top:6,right:8,background:"#5DADE2",color:"white",borderRadius:10,padding:"1px 7px",fontSize:11,fontWeight:900}}>{"\u00d7"}{n}</div>}
          <div style={{fontSize:32,lineHeight:1}}>{t.emoji}</div>
          <div style={{fontSize:12,fontWeight:800,color:"#333",marginTop:6}}>{t.label}</div>
          <div style={{fontSize:16,fontWeight:900,color:"#5DADE2",marginTop:4}}>{"+"}</div>
        </button>);})}
      </div>
    </Card>}

    {!edit&&pct===100&&schedule.length>0&&<div style={{background:"linear-gradient(135deg,#FFD700,#FF8C69)",borderRadius:20,padding:"18px",textAlign:"center",color:"white",fontWeight:900,fontSize:20,animation:"bounce 1s ease-in-out infinite",marginTop:12}}>ALL DONE! You are a superstar!</div>}
  </div>);
}

function TalkView({cat,setCat,sentence,addWord,delWord,clearSen,lastSaid,speak}){return(<div style={{animation:"slideIn .3s ease-out"}}><div style={{background:"linear-gradient(135deg,#5DADE2,#3498DB)",borderRadius:20,padding:"14px 16px",marginBottom:14}}><div style={{fontSize:10,fontWeight:800,color:"rgba(255,255,255,.7)",letterSpacing:"1.5px",marginBottom:7}}>MY SENTENCE</div><div style={{minHeight:50,background:"rgba(255,255,255,.18)",borderRadius:13,padding:"10px 12px",display:"flex",flexWrap:"wrap",gap:6,alignItems:"center",marginBottom:11}}>{sentence.length===0?<span style={{color:"rgba(255,255,255,.5)",fontSize:13,fontWeight:700,fontStyle:"italic"}}>Tap words below to build</span>:sentence.map((w,i)=><span key={i} style={{background:"rgba(255,255,255,.28)",borderRadius:9,padding:"4px 10px",fontSize:13,fontWeight:800,color:"white",animation:"wordFly .2s ease-out"}}>{w}</span>)}</div><div style={{display:"flex",gap:7}}><button onClick={speak} disabled={!sentence.length} style={{flex:3,background:sentence.length?"#27AE60":"rgba(255,255,255,.18)",border:"none",borderRadius:13,padding:"12px",color:"white",fontWeight:900,fontSize:15,cursor:sentence.length?"pointer":"default",fontFamily:"inherit"}}>Say It!</button><button onClick={delWord} disabled={!sentence.length} style={{flex:1,background:"rgba(255,255,255,.18)",border:"none",borderRadius:13,padding:"12px",color:"white",fontWeight:800,fontSize:15,cursor:"pointer",fontFamily:"inherit"}}>Back</button><button onClick={clearSen} style={{flex:1,background:"rgba(255,255,255,.18)",border:"none",borderRadius:13,padding:"12px",color:"white",fontWeight:800,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Clear</button></div></div><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(168px,1fr))",gap:10,marginBottom:12}}>{[["WHO",SW,"#5DADE2"],["DO / FEEL",AW,"#9B59B6"],["WHERE / HOW",PW,"#E8743B"],["EXTRAS",EW,"#27AE60"]].map(([lbl,words,col])=><Card key={lbl}><div style={{fontSize:11,fontWeight:800,color:"#888",marginBottom:7}}>{lbl}</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{words.map(o=><button key={o.w} onClick={()=>addWord(o.w)} style={{background:col+"18",border:"2px solid "+col,borderRadius:16,padding:"7px 11px",cursor:"pointer",fontFamily:"inherit",minHeight:52,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}><span style={{fontSize:20,lineHeight:1}}>{o.e}</span><span style={{fontSize:13,fontWeight:800,color:col}}>{o.w}</span></button>)}</div></Card>)}</div><div style={{display:"flex",gap:7,marginBottom:10,overflowX:"auto",paddingBottom:3}}>{CATS.map(c=><button key={c} onClick={()=>setCat(c)} style={{background:cat===c?"#5DADE2":"white",color:cat===c?"white":"#888",border:cat===c?"2px solid #5DADE2":"2px solid #e8e8e8",borderRadius:18,padding:"8px 14px",cursor:"pointer",fontWeight:800,fontSize:13,whiteSpace:"nowrap",fontFamily:"inherit",flexShrink:0}}>{c}</button>)}</div><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(125px,1fr))",gap:9}}>{(AAC[cat]||[]).map(item=><button key={item.p} onClick={()=>addWord(item.p)} style={{background:item.c+"20",border:"2.5px solid "+item.c,borderRadius:16,padding:"13px 8px",cursor:"pointer",textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",gap:5,fontFamily:"inherit",minHeight:96}}><span style={{fontSize:36,lineHeight:1}}>{item.e}</span><span style={{fontSize:12,fontWeight:800,color:"#333"}}>{item.p}</span></button>)}</div>{lastSaid&&<div style={{marginTop:12,background:"#F0FFF4",border:"2px solid #A8E6CF",borderRadius:13,padding:"10px 14px",fontSize:13,fontWeight:700,color:"#27AE60"}}>Said: {lastSaid}</div>}</div>);}

function CalmView({emotion,checkIn,bPhase,bRound,breathe,markCalm,calmDone,award}){
  const [sub,setSub]=useState("feelings");const [act,setAct]=useState(null);
  const bs={idle:"1",inhale:"1.4",hold:"1.4",exhale:".65",done:"1.1"}[bPhase]||"1";
  const bt={inhale:"transform 4s ease-in-out",hold:"transform .05s",exhale:"transform 4s ease-in-out",done:"transform .6s",idle:"transform .4s"}[bPhase]||"transform .4s";

  const bc={idle:"#26C6DA",inhale:"#74B9FF",hold:"#A29BFE",exhale:"#81ECEC",done:"#4CAF50"}[bPhase];
  const acts=[{id:"bubbles",emoji:"🫧",label:"Pop Bubbles",color:"#5DADE2"},{id:"fidget",emoji:"🌀",label:"Fidget Spinner",color:"#9B59B6"},{id:"breathing",emoji:"🌬️",label:"Deep Breathing",color:"#26C6DA"},{id:"rain",emoji:"🌧️",label:"Watch Rain",color:"#5D6D7E"},{id:"ground",emoji:"🖐️",label:"5-4-3-2-1",color:"#E17055"},{id:"stars",emoji:"🌌",label:"Starry Night",color:"#3949AB"}];

  {sub==="feelings"&&<><Card style={{marginBottom:12}}><div style={{fontSize:14,fontWeight:900,marginBottom:12,textAlign:"center"}}>How are you feeling right now?</div><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,maxWidth:380,margin:"0 auto"}}>{EM.map(em=><button key={em.label} onClick={()=>checkIn(em)} style={{background:emotion?.label===em.label?em.c+"32":"#f8f9fa",border:"3px solid "+(emotion?.label===em.label?em.c:"transparent"),borderRadius:15,padding:"11px 4px",cursor:"pointer",textAlign:"center",fontFamily:"inherit",minHeight:74}}><div style={{fontSize:28,lineHeight:1,animation:emotion?.label===em.label?"wiggle .5s ease-in-out 3":"none"}}>{em.emoji}</div><div style={{fontSize:10,fontWeight:800,color:"#555",marginTop:3}}>{em.label}</div></button>)}</div></Card>
  {emotion&&<div style={{background:emotion.c+"22",border:"2.5px solid "+emotion.c,borderRadius:20,padding:"16px 18px",marginBottom:14}}><div style={{fontSize:48,textAlign:"center",marginBottom:8,animation:"bounce .9s ease-in-out 3"}}>{emotion.emoji}</div><div style={{fontWeight:900,fontSize:16,color:"#333",textAlign:"center",marginBottom:6}}>You feel {emotion.label}!</div><div style={{fontSize:13,color:"#555",textAlign:"center",lineHeight:1.65,fontWeight:700}}>{emotion.tip}</div>{emotion.type==="breathe"&&<button onClick={()=>{setSub("corner");setAct("breathing");}} style={{display:"block",margin:"12px auto 0",background:emotion.c,color:"white",border:"none",borderRadius:20,padding:"9px 20px",fontWeight:900,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Go to Breathing</button>}{emotion.type==="ground"&&<button onClick={()=>{setSub("corner");setAct("ground");markCalm("ground");}} style={{display:"block",margin:"12px auto 0",background:emotion.c,color:"white",border:"none",borderRadius:20,padding:"9px 20px",fontWeight:900,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Try 5-4-3-2-1</button>}</div>}</>}
  {sub==="corner"&&!act&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:12}}>{acts.map(a=><div key={a.id} className="lift" onClick={()=>{SFX.tap();setAct(a.id);markCalm(a.id);}} style={{background:a.color+"18",border:"2px solid "+a.color+"40",borderRadius:20,padding:"20px 10px",textAlign:"center",cursor:"pointer",position:"relative",minHeight:110}}>{calmDone.includes(a.id)&&<div style={{position:"absolute",top:7,right:9,fontSize:11,fontWeight:800,color:a.color}}>done</div>}<div style={{fontSize:38,marginBottom:7}}>{a.emoji}</div><div style={{fontWeight:800,fontSize:13,color:"#333"}}>{a.label}</div></div>)}</div>}

  </div>}</div>);}

function PatternGame({onWin}){
